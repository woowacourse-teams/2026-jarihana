name: Auto Assign High-Risk Reviewer

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-assign-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign-reviewer:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Request one reviewer for a high-risk PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/auto-assign-reviewer.cjs
