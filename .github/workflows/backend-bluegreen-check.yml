name: Backend Blue-Green Bash Checks
on:
  pull_request:
    paths:
      - infra/scripts/deploy/actions/**
      - infra/scripts/deploy/migration-review.sh
      - infra/tests/deploy/actions/**
      - infra/deploy/controller/**
      - .github/workflows/backend-bluegreen-*.yml
      - .github/workflows/backend-app-operation.yml
      - .github/workflows/backend-migration-review.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bash와 jq 도구 확인
        run: |
          bash --version
          jq --version
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
      - name: Bash 구문과 실행 오류 정적 검사
        shell: bash
        run: |
          for file in infra/scripts/deploy/actions/*.sh infra/scripts/deploy/migration-review.sh infra/tests/deploy/actions/*.sh; do
            bash -n "$file"
          done
          shellcheck --severity=error --external-sources --source-path=SCRIPTDIR \
            infra/scripts/deploy/actions/*.sh infra/scripts/deploy/migration-review.sh
      - name: 격리된 로컬 계약 테스트
        # Protected-file tests create root-owned temporary fixtures, without business secrets.
        run: sudo bash infra/tests/deploy/actions/run-tests.sh
