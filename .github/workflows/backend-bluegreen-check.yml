name: Backend Blue-Green Bash Checks
on:
  pull_request:
    paths:
      - infra/blue-green-deploy/**
      - infra/monitoring/deployment/**
      - infra/scripts/deploy/actions/**
      - infra/tests/deploy/telemetry/**
      - .github/workflows/backend-bluegreen-*.yml
      - .github/workflows/backend-app-operation.yml
      - .github/workflows/backend-dev-deploy.yml
      - .github/workflows/backend-prod-deploy.yml
      - .github/workflows/frontend-prod-deploy.yml
      - .github/workflows/backend-migration-review.yml
      - '!infra/blue-green-deploy/**/*.md'
      - '!infra/blue-green-deploy/docs/**'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bash와 jq 도구 확인
        run: |
          bash --version
          jq --version
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
      - name: Bash 구문과 실행 오류 정적 검사
        shell: bash
        run: |
          for file in infra/blue-green-deploy/scripts/actions/*.sh infra/blue-green-deploy/scripts/migration-review.sh infra/blue-green-deploy/tests/actions/*.sh; do
            bash -n "$file"
          done
          shellcheck --severity=error --external-sources --source-path=SCRIPTDIR \
            infra/blue-green-deploy/scripts/actions/*.sh infra/blue-green-deploy/scripts/migration-review.sh
      - name: 격리된 로컬 계약 테스트
        # Protected-file tests create root-owned temporary fixtures, without business secrets.
        run: sudo bash infra/blue-green-deploy/tests/actions/run-tests.sh
  api-budget-shard:
    name: api-budget shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 전체 배포와 롤백의 GitHub 요청 예산 검증
        run: sudo bash infra/blue-green-deploy/tests/actions/run-api-budget.sh "${{ matrix.shard }}" 4
  api-budget:
    needs: api-budget-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 모든 호출량 검증 결과 확인
        env:
          RESULT: ${{ needs.api-budget-shard.result }}
        run: test "$RESULT" = success
  collector:
    name: Central deployment collector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 수집기 구문과 읽기 전용 계약 검사
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes shellcheck
          fi
          for file in infra/monitoring/deployment/*.sh infra/scripts/deploy/actions/*.sh infra/tests/deploy/telemetry/*.sh; do
            bash -n "$file"
          done
          shellcheck --severity=error --external-sources --source-path=SCRIPTDIR \
            infra/monitoring/deployment/*.sh infra/scripts/deploy/actions/*.sh
          sudo bash infra/tests/deploy/telemetry/run-tests.sh
