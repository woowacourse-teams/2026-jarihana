name: Backend Blue-Green Coordinator Check

on:
  push:
    branches: [feat/blue-green-deployment]
    paths:
      - .github/workflows/backend-bluegreen-coordinator-check.yml
      - infra/scripts/deploy/check-coordinator.sh

permissions:
  contents: read

concurrency:
  group: backend-bluegreen-coordinator-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'woowacourse-teams/2026-jarihana'
    runs-on: [jarihana-bluegreen-coordinator]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Nginx 서버 신원·EC2 권한·기존 요청 경로 확인
        shell: bash
        run: bash infra/scripts/deploy/check-coordinator.sh
