name: Backend Blue-Green Trial Image

on:
  push:
    branches: [feat/blue-green-deployment]
    paths:
      - .github/workflows/backend-bluegreen-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-bluegreen-trial-image
  cancel-in-progress: false

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: printf 'BLUEGREEN_IMAGE_WORKFLOW_REGISTERED\n'

  build:
    if: >-
      github.repository == 'woowacourse-teams/2026-jarihana' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feat/blue-green-deployment' && github.run_attempt == 1
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*
      - name: Backend 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: ARM64 시험 이미지 업로드
        id: build
        uses: docker/build-push-action@v6
        with:
          context: '{{defaultContext}}:backend'
          platforms: linux/arm64
          push: true
          tags: ghcr.io/woowacourse-teams/jarihana-backend:worker-trial-${{ github.sha }}
      - name: JVM 기동 검사 및 이미지 식별자 기록
        env:
          IMAGE: ghcr.io/woowacourse-teams/jarihana-backend
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "${IMAGE}@${DIGEST}"
          docker run --rm --network none -e OTEL_SDK_DISABLED=true \
            --entrypoint java "${IMAGE}@${DIGEST}" -version
          image_id="$(docker image inspect --format '{{.Id}}' "${IMAGE}@${DIGEST}")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'commit=%s\nimage=%s\nmanifest_digest=%s\nimage_id=%s\n' \
            "$GITHUB_SHA" "$IMAGE" "$DIGEST" "$image_id" > "$RUNNER_TEMP/worker-trial-image.txt"
          cat "$RUNNER_TEMP/worker-trial-image.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: worker-trial-image-${{ github.run_id }}
          path: ${{ runner.temp }}/worker-trial-image.txt
          if-no-files-found: error
          retention-days: 7
