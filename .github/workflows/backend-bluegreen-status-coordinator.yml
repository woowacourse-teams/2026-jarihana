name: Backend Blue-Green STATUS Coordinator

on:
  push:
    branches: [feat/blue-green-deployment]
    paths:
      - .github/workflows/backend-bluegreen-status-coordinator.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: printf 'STATUS_COORDINATOR_REGISTERED\n'

  status:
    if: >-
      github.repository == 'woowacourse-teams/2026-jarihana' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feat/blue-green-deployment' && github.run_attempt == 1
    runs-on: [jarihana-bluegreen-coordinator]
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write
    concurrency:
      group: backend-bluegreen-status-coordinator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Nginx에서 B 상태 조회 요청과 결과 수집
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --script infra/scripts/deploy/status-coordinator.py
      - uses: actions/upload-artifact@v4
        with:
          name: status-coordinator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bg-coordinator-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error
          retention-days: 3
