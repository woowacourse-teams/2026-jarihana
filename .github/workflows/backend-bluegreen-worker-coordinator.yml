name: Backend Blue-Green Worker Coordinator

on:
  push:
    branches: [feat/blue-green-deployment]
    paths:
      - .github/workflows/backend-bluegreen-worker-coordinator.yml
  workflow_dispatch:
    inputs:
      scenario:
        description: 'smoke=시작·완료, round-trip=초기 준비·A/B 왕복·종료 정리 (서버 관리자 허용 필요)'
        type: choice
        required: true
        default: smoke
        options: [smoke, round-trip]

permissions:
  contents: read

jobs:
  register:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: printf 'WORKER_COORDINATOR_REGISTERED\n'

  worker-smoke:
    if: >-
      github.repository == 'woowacourse-teams/2026-jarihana' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feat/blue-green-deployment' && github.run_attempt == 1
    runs-on: [jarihana-bluegreen-coordinator]
    timeout-minutes: 55
    permissions:
      contents: read
      actions: write
    concurrency:
      group: backend-bluegreen-worker-coordinator
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.5'
          enable-cache: false
      - name: 관리자 설정과 일치하는 worker 시험 실행
        env:
          GH_TOKEN: ${{ github.token }}
          BG_SCENARIO: ${{ inputs.scenario }}
        run: uv run --no-project --script infra/scripts/deploy/worker-coordinator.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-coordinator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bg-worker-coordinator-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 3
