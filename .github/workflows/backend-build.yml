name: Backend Docker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:
    inputs:
      operation:
        description: "실행할 작업"
        type: choice
        default: backend-deploy
        options:
          - backend-deploy
          - cloudwatch-inspect
          - cloudwatch-prepare
          - cloudwatch-install
          - cloudwatch-verify
      expected_instance_id:
        description: "CloudWatch 작업 대상 EC2 ID (inspect 외 작업 시 필수)"
        required: false
        type: string
      expected_current_image:
        description: "현재 운영 이미지 확인값 (지정 시 일치하지 않으면 배포 중단)"
        required: false
        type: string

jobs:
  deploy:
    if: ${{ inputs.operation == '' || inputs.operation == 'backend-deploy' }}
    runs-on: self-hosted
    env:
      BACKEND_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker 확인
        run: |
          whoami
          docker version

      - name: 이전 Backend 이미지 기록
        id: previous
        env:
          EXPECTED_CURRENT_IMAGE: ${{ inputs.expected_current_image }}
        run: |
          previous_image="$(docker inspect --format '{{.Config.Image}}' jarihana-backend 2>/dev/null || true)"
          echo "Previous backend image: ${previous_image}"
          if [[ -n "${EXPECTED_CURRENT_IMAGE}" ]]; then
            test "${previous_image}" = "${EXPECTED_CURRENT_IMAGE}"
          fi
          if [[ "${previous_image}" == jarihana-backend:* ]]; then
            echo "backend_tag=${previous_image#jarihana-backend:}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Backend 이미지 빌드
        run: |
          docker build \
            -t jarihana-backend:${BACKEND_TAG} \
            ./backend

      - name: Compose로 Backend 배포
        id: rollout
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
          IMAGE_S3_BUCKET: ${{ secrets.IMAGE_S3_BUCKET }}
          IMAGE_S3_REGION: ${{ secrets.IMAGE_S3_REGION }}
          IMAGE_S3_KEY_PREFIX: ${{ secrets.IMAGE_S3_KEY_PREFIX }}
          IMAGE_S3_PUBLIC_BASE_URL: ${{ secrets.IMAGE_S3_PUBLIC_BASE_URL }}
        run: |
          docker compose \
            -f infra/docker-compose.yml \
            up -d --no-build backend

      - name: Backend 컨테이너 상태 확인
        run: |
          container_id="$(docker ps -q --filter 'name=^/jarihana-backend$')"
          test -n "${container_id}"
          test "$(docker inspect -f '{{.State.Status}}' "${container_id}")" = "running"
          docker ps --filter 'name=^/jarihana-backend$'

      - name: Backend API와 관리용 메트릭 확인
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 \
            http://127.0.0.1:8081/actuator/health > /dev/null

          metrics="$(curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8081/actuator/prometheus)"
          [[ "${metrics}" == *jvm_memory_used_bytes* ]]
          [[ "${metrics}" == *hikaricp_connections_active* ]]
          test "$(docker port jarihana-backend 8081/tcp)" = "127.0.0.1:8081"

          api_status="$(curl --silent --show-error --max-time 10 \
            --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/groups)"
          test "${api_status}" = "200"
          metrics_status="$(curl --silent --show-error --max-time 10 \
            --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/actuator/prometheus)"
          test "${metrics_status}" = "403"
          echo "Health and Prometheus: 200; groups API: ${api_status}; public-port metrics: ${metrics_status}"

      - name: 검증 실패 시 이전 Backend 이미지 복구
        if: ${{ failure() && (steps.rollout.outcome == 'success' || steps.rollout.outcome == 'failure') && steps.previous.outputs.backend_tag != '' }}
        env:
          BACKEND_TAG: ${{ steps.previous.outputs.backend_tag }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
          IMAGE_S3_BUCKET: ${{ secrets.IMAGE_S3_BUCKET }}
          IMAGE_S3_REGION: ${{ secrets.IMAGE_S3_REGION }}
          IMAGE_S3_KEY_PREFIX: ${{ secrets.IMAGE_S3_KEY_PREFIX }}
          IMAGE_S3_PUBLIC_BASE_URL: ${{ secrets.IMAGE_S3_PUBLIC_BASE_URL }}
        run: |
          docker compose -f infra/docker-compose.yml up -d --no-build --no-deps backend
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 \
            http://127.0.0.1:8080/api/groups > /dev/null

  cloudwatch:
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.operation, 'cloudwatch-') }}
    runs-on: [self-hosted, Linux, ARM64]
    permissions:
      contents: read
    env:
      EXPECTED_INSTANCE_ID: ${{ inputs.expected_instance_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: CloudWatch 설치 전 환경 확인
        if: ${{ inputs.operation == 'cloudwatch-inspect' }}
        run: bash infra/cloudwatch/inspect.sh
      - name: CloudWatch 수집 설정 검증
        if: ${{ inputs.operation == 'cloudwatch-prepare' || inputs.operation == 'cloudwatch-install' }}
        run: python3 infra/cloudwatch/validate.py
      - name: CloudWatch 로그 그룹과 보존 기간 설정
        if: ${{ inputs.operation == 'cloudwatch-prepare' || inputs.operation == 'cloudwatch-install' }}
        run: bash infra/cloudwatch/prepare-aws.sh
      - name: CloudWatch Agent 설치와 시작
        if: ${{ inputs.operation == 'cloudwatch-install' }}
        run: sudo -n --preserve-env=EXPECTED_INSTANCE_ID bash infra/cloudwatch/install.sh
      - name: CloudWatch 실제 수신 확인
        if: ${{ inputs.operation == 'cloudwatch-install' || inputs.operation == 'cloudwatch-verify' }}
        run: bash infra/cloudwatch/verify.sh
