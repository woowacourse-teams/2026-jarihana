name: Backend Docker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      BACKEND_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker 확인
        run: |
          whoami
          docker version

      - name: Backend 이미지 빌드
        run: |
          docker build \
            -t jarihana-backend:${BACKEND_TAG} \
            ./backend

      - name: Compose로 Backend 배포
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
        run: |
          docker compose \
            -f infra/docker-compose.yml \
            up -d --no-build backend

      - name: Backend 컨테이너 상태 확인
        run: |
          container_id="$(docker ps -q --filter 'name=^/jarihana-backend$')"
          test -n "${container_id}"
          test "$(docker inspect -f '{{.State.Status}}' "${container_id}")" = "running"
          docker ps --filter 'name=^/jarihana-backend$'
