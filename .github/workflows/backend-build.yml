name: Backend Docker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-build.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      BACKEND_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker 확인
        run: |
          whoami
          docker version

      - name: Backend 이미지 빌드
        run: |
          docker build \
            -t jarihana-backend:${BACKEND_TAG} \
            ./backend

      - name: Compose로 Backend 배포
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
          IMAGE_S3_BUCKET: ${{ secrets.IMAGE_S3_BUCKET }}
          IMAGE_S3_REGION: ${{ secrets.IMAGE_S3_REGION }}
          IMAGE_S3_KEY_PREFIX: ${{ secrets.IMAGE_S3_KEY_PREFIX }}
          IMAGE_S3_PUBLIC_BASE_URL: ${{ secrets.IMAGE_S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          docker compose -p jarihana-backend -f backend/docker-compose-prod.yaml config --quiet
          docker image inspect "jarihana-backend:${BACKEND_TAG}" > /dev/null

          exec 9>/tmp/jarihana-production-deploy.lock
          flock -w 180 9
          if ! docker network inspect infra_default > /dev/null 2>&1; then
            echo '::error::infra_default 네트워크가 없습니다. Infrastructure Docker Deploy를 먼저 실행하세요.'
            exit 1
          fi
          if ! db_state="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}/{{index .Config.Labels "com.docker.compose.service"}}/{{.State.Health.Status}}' jarihana-db-postgres 2>/dev/null)" || [[ "${db_state}" != "infra/postgres/healthy" ]]; then
            echo '::error::Infrastructure Docker Deploy를 먼저 실행하고 DB 상태를 확인하세요.'
            exit 1
          fi
          test "$(docker inspect --format '{{with index .NetworkSettings.Networks "infra_default"}}connected{{end}}' jarihana-db-postgres)" = connected

          backend_id="$(docker ps -aq --filter 'name=^/jarihana-backend$')"
          if [[ -n "${backend_id}" ]]; then
            owner="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}/{{index .Config.Labels "com.docker.compose.service"}}' "${backend_id}")"
            case "${owner}" in
              infra/backend)
                docker stop --time 30 "${backend_id}"
                docker rm "${backend_id}"
                ;;
              jarihana-backend/backend) ;;
              *)
                echo '::error::기존 backend 컨테이너의 Compose 소유자가 예상과 다릅니다.'
                exit 1
                ;;
            esac
          fi

          docker compose \
            -p jarihana-backend \
            -f backend/docker-compose-prod.yaml \
            up -d --no-build --wait --wait-timeout 60 backend

      - name: Backend 컨테이너 상태 확인
        run: |
          container_id="$(docker ps -q --filter 'name=^/jarihana-backend$')"
          test -n "${container_id}"
          test "$(docker inspect -f '{{.State.Status}}' "${container_id}")" = "running"
          docker ps --filter 'name=^/jarihana-backend$'
