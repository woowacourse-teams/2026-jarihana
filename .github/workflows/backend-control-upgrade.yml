name: Production Control Upgrade
on:
  workflow_call:
    outputs:
      control_ref:
        value: ${{ jobs.ready.outputs.control_ref }}
permissions:
  contents: read
  actions: read
jobs:
  select:
    runs-on: [jarihana-bluegreen-coordinator]
    environment: prod
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      control_ref: ${{ steps.select.outputs.control_ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: 설치된 제어 버전과 main 비교 및 고정 태그 발급
        run: bash infra/blue-green-deploy/scripts/actions/control-release.sh
      - name: 교체할 앱 호스트와 runner 준비
        if: steps.select.outputs.changed == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' "$GH_TOKEN" | sudo -n /usr/local/sbin/jarihana-control-upgrade wake "$GITHUB_RUN_ID" "$GITHUB_SHA"
  prepare-a:
    needs: select
    if: needs.select.outputs.changed == 'true'
    uses: ./.github/workflows/backend-control-host.yml
    with:
      runner: ${{ vars.BLUE_GREEN_PROD_A_RUNNER }}
      operation: prepare
  prepare-b:
    needs: select
    if: needs.select.outputs.changed == 'true'
    uses: ./.github/workflows/backend-control-host.yml
    with:
      runner: ${{ vars.BLUE_GREEN_PROD_B_RUNNER }}
      operation: prepare
  prepare-coordinator:
    needs: select
    if: needs.select.outputs.changed == 'true'
    uses: ./.github/workflows/backend-control-host.yml
    with:
      runner: jarihana-bluegreen-coordinator
      operation: prepare
  verify:
    needs: [prepare-a, prepare-b, prepare-coordinator]
    runs-on: [jarihana-bluegreen-coordinator]
    environment: prod
    timeout-minutes: 2
    env:
      SNAPSHOT_A: ${{ needs.prepare-a.outputs.report }}
      SNAPSHOT_B: ${{ needs.prepare-b.outputs.report }}
      SNAPSHOT_COORDINATOR: ${{ needs.prepare-coordinator.outputs.report }}
    steps:
      - name: 실제 활성 앱과 완료 저널의 boot 및 이미지 대조
        run: |
          set -euo pipefail
          journal=/var/lib/jarihana-deploy/prod/state.json
          jq -e --argjson a "$SNAPSHOT_A" --argjson b "$SNAPSHOT_B" \
            --argjson coordinator "$SNAPSHOT_COORDINATOR" \
            --slurpfile config /etc/jarihana-deploy/prod/coordinator.json '
            . as $journal | [$a,$b] as $hosts |
            ([$hosts[]|select(.running and .worker.state=="ACTIVE")]) as $active |
            ($active|length)==1 and $a.slot=="A" and $b.slot=="B" and
            $active[0].slot==$coordinator.active and $coordinator.topology==$config[0].topology and
            all($hosts[]; .topology==$config[0].topology) and
            ([$journal.old_status,$journal.target_status] | any(.[];
              .slot==$coordinator.active and .identity==$active[0].identity and
              .image==$active[0].version and .authority.owner==.identity and
              .authority==$active[0].authority)) and
            all($hosts[]; (.running|not) or .authority==$active[0].authority)
          ' "$journal" >/dev/null
  activate-apps:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        runner: ["${{ vars.BLUE_GREEN_PROD_A_RUNNER }}", "${{ vars.BLUE_GREEN_PROD_B_RUNNER }}"]
    uses: ./.github/workflows/backend-control-host.yml
    with:
      runner: ${{ matrix.runner }}
      operation: activate
  activate-coordinator:
    needs: activate-apps
    uses: ./.github/workflows/backend-control-host.yml
    with:
      runner: jarihana-bluegreen-coordinator
      operation: activate
  finish:
    needs: activate-coordinator
    strategy:
      fail-fast: false
      matrix:
        runner: [jarihana-bluegreen-coordinator, "${{ vars.BLUE_GREEN_PROD_A_RUNNER }}", "${{ vars.BLUE_GREEN_PROD_B_RUNNER }}"]
    uses: ./.github/workflows/backend-control-host.yml
    with:
      runner: ${{ matrix.runner }}
      operation: finish
  rollback:
    needs: [select, prepare-a, prepare-b, prepare-coordinator, verify, activate-apps, activate-coordinator, finish]
    if: always() && needs.select.outputs.changed == 'true' && needs.finish.result != 'success'
    strategy:
      fail-fast: false
      matrix:
        runner: [jarihana-bluegreen-coordinator, "${{ vars.BLUE_GREEN_PROD_A_RUNNER }}", "${{ vars.BLUE_GREEN_PROD_B_RUNNER }}"]
    uses: ./.github/workflows/backend-control-host.yml
    with:
      runner: ${{ matrix.runner }}
      operation: rollback
  ready:
    needs: [select, finish, rollback]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      control_ref: ${{ needs.select.outputs.control_ref }}
    env:
      SELECT_RESULT: ${{ needs.select.result }}
      CHANGED: ${{ needs.select.outputs.changed }}
      FINISH_RESULT: ${{ needs.finish.result }}
      CONTROL_REF: ${{ needs.select.outputs.control_ref }}
    steps:
      - run: |
          test "$SELECT_RESULT" = success
          test "$CHANGED" = false || test "$FINISH_RESULT" = success
          printf '운영 제어 태그: %s / 이번 실행에서 교체: %s\n' "$CONTROL_REF" "$CHANGED" >> "$GITHUB_STEP_SUMMARY"
