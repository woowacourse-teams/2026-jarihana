name: Backend Development Deploy

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "infra/docker-compose.dev.yml"
      - ".github/workflows/backend-dev-deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "다시 배포할 기존 이미지 태그(커밋 SHA). 비우면 현재 커밋을 빌드해 배포한다."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ghcr.io/woowacourse-teams/jarihana-backend-dev

jobs:
  # 이미지는 GitHub 호스팅 ARM runner에서 빌드해 GHCR에 올린다. 서버는 빌드하지 않는다.
  build:
    if: github.ref == 'refs/heads/develop' && inputs.image_tag == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR 로그인
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Backend 이미지 빌드
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "${BACKEND_IMAGE}:${BACKEND_TAG}" \
            ./backend

      - name: GHCR에 이미지 push
        run: docker push "${BACKEND_IMAGE}:${BACKEND_TAG}"

  # dev EC2의 runner는 GHCR에서 이미지를 받아 컨테이너만 교체한다.
  # image_tag를 넣어 수동 실행하면 빌드를 건너뛰고 그 태그로 다시 배포한다.
  deploy:
    needs: build
    if: >-
      always()
      && github.ref == 'refs/heads/develop'
      && (needs.build.result == 'success'
        || (needs.build.result == 'skipped' && inputs.image_tag != ''))
    runs-on: [jarihana-dev]
    environment: dev
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_TAG: ${{ inputs.image_tag || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR 로그인
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Backend 이미지 받기
        run: docker pull "${BACKEND_IMAGE}:${BACKEND_TAG}"

      - name: Compose로 Backend 배포
        env:
          RDS_URL: ${{ vars.RDS_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED || 'false' }}
          PUSH_WORKER_ENABLED: ${{ vars.PUSH_WORKER_ENABLED || 'true' }}
          PUSH_VAPID_PUBLIC_KEY: ${{ vars.PUSH_VAPID_PUBLIC_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_VAPID_SUBJECT: ${{ vars.PUSH_VAPID_SUBJECT }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
          IMAGE_S3_BUCKET: ${{ vars.IMAGE_S3_BUCKET }}
          IMAGE_S3_REGION: ${{ vars.IMAGE_S3_REGION }}
          IMAGE_S3_KEY_PREFIX: ${{ vars.IMAGE_S3_KEY_PREFIX }}
          IMAGE_S3_PUBLIC_BASE_URL: ${{ vars.IMAGE_S3_PUBLIC_BASE_URL }}
        run: |
          unset COMPOSE_PROJECT_NAME
          docker compose \
            -f infra/docker-compose.dev.yml \
            up -d --no-build backend

      - name: GHCR 로그아웃
        if: always()
        run: docker logout ghcr.io

      - name: Backend 컨테이너 상태 확인
        run: |
          container_id="$(docker ps -q \
            --filter 'label=com.docker.compose.project=jarihana-dev' \
            --filter 'label=com.docker.compose.service=backend')"
          test -n "${container_id}"
          test "$(docker inspect -f '{{.State.Status}}' "${container_id}")" = "running"
          docker ps --filter "id=${container_id}"

      - name: Backend 관리용 메트릭 확인
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 \
            http://127.0.0.1:8081/actuator/health > /dev/null

          metrics="$(curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:8081/actuator/prometheus)"
          [[ "${metrics}" == *jvm_memory_used_bytes* ]]
          [[ "${metrics}" == *hikaricp_connections_active* ]]
          [[ "${metrics}" == *'environment="dev"'* ]]

          container_id="$(docker ps -q \
            --filter 'label=com.docker.compose.project=jarihana-dev' \
            --filter 'label=com.docker.compose.service=backend')"
          test "$(docker port "${container_id}" 8081/tcp)" = "127.0.0.1:8081"
          api_status="$(curl --silent --show-error --max-time 10 \
            --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/groups)"
          test "${api_status}" = "200"
          public_metrics_status="$(curl --silent --show-error --max-time 10 \
            --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/actuator/prometheus)"
          test "${public_metrics_status}" = "403"

      # 이 저장소가 만든 이미지 중 실행 중이 아니고 일주일이 지난 것만 지운다.
      # 이전 버전은 GHCR에 남아 있으므로 image_tag 수동 실행으로 다시 받을 수 있다.
      - name: 오래된 Backend 이미지 정리
        run: |
          docker image prune -af \
            --filter "until=168h" \
            --filter "label=org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
