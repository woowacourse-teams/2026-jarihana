name: Backend Development Deploy

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "infra/docker-compose.dev.yml"
      - "infra/scripts/verify-backend.sh"
      - ".github/workflows/backend-dev-deploy.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "개발 백엔드 배포 또는 달력 데이터 백필을 선택한다."
        type: choice
        required: true
        default: deploy
        options:
          - deploy
          - group-calendar-backfill
      batch_size:
        description: "달력 백필 한 번에 처리할 모임 수"
        type: choice
        required: true
        default: "50"
        options:
          - "25"
          - "50"
          - "100"
      image_tag:
        description: "다시 배포할 기존 이미지 태그(커밋 SHA). 비우면 현재 커밋을 빌드해 배포한다."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

env:
  # dev와 prod가 같은 이미지를 쓴다. prod는 main의 backend 트리 해시로 이 이미지를 찾아 받는다.
  BACKEND_IMAGE: ghcr.io/woowacourse-teams/jarihana-backend

jobs:
  # 이미지는 GitHub 호스팅 ARM runner에서 빌드해 GHCR에 올린다. 서버는 빌드하지 않는다.
  build:
    if: github.ref == 'refs/heads/develop' && inputs.operation != 'group-calendar-backfill' && inputs.image_tag == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR 로그인
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      # 커밋 SHA 태그는 실행 중인 컨테이너를 커밋에 잇는다.
      # 트리 해시 태그는 squash나 merge commit으로 main에 들어가도 backend 코드가 같으면 같은 값이라,
      # prod가 다시 빌드하지 않고 이 이미지를 찾는 데 쓴다.
      - name: Backend 이미지 빌드
        run: |
          BACKEND_TREE="$(git rev-parse HEAD:backend)"
          echo "BACKEND_TREE=${BACKEND_TREE}" >> "${GITHUB_ENV}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${BACKEND_TAG}" \
            -t "${BACKEND_IMAGE}:${BACKEND_TAG}" \
            -t "${BACKEND_IMAGE}:tree-${BACKEND_TREE}" \
            ./backend

      - name: GHCR에 이미지 push
        run: |
          docker push "${BACKEND_IMAGE}:${BACKEND_TAG}"
          docker push "${BACKEND_IMAGE}:tree-${BACKEND_TREE}"

  # dev EC2의 runner는 GHCR에서 이미지를 받아 컨테이너만 교체한다.
  # 교체 뒤 readiness 대기와 스모크 테스트를 하고, 실패하면 직전 성공 태그로 되돌린 뒤 실패로 끝낸다.
  # image_tag를 넣어 수동 실행하면 빌드를 건너뛰고 그 태그로 다시 배포한다. 없는 태그면 받기에서 실패한다.
  deploy:
    needs: build
    if: >-
      always()
      && github.ref == 'refs/heads/develop'
      && inputs.operation != 'group-calendar-backfill'
      && (needs.build.result == 'success'
        || (needs.build.result == 'skipped' && inputs.image_tag != ''))
    runs-on: [jarihana-dev]
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # 배포와 롤백이 같은 Compose 명령을 쓰므로 실행 값은 job 단위로 둔다.
    env:
      BACKEND_TAG: ${{ inputs.image_tag || github.sha }}
      # runner 계정의 홈 디렉터리 기준 경로
      LAST_SUCCESS_FILE: .jarihana/backend-dev-last-success
      RDS_URL: ${{ vars.RDS_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      PUSH_ENABLED: ${{ vars.PUSH_ENABLED || 'false' }}
      PUSH_WORKER_ENABLED: ${{ vars.PUSH_WORKER_ENABLED || 'true' }}
      PUSH_VAPID_PUBLIC_KEY: ${{ vars.PUSH_VAPID_PUBLIC_KEY }}
      PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
      PUSH_VAPID_SUBJECT: ${{ vars.PUSH_VAPID_SUBJECT }}
      SENTRY_BACKEND_DSN: ${{ vars.SENTRY_BACKEND_DSN }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      GITHUB_OAUTH_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
      IMAGE_S3_BUCKET: ${{ vars.IMAGE_S3_BUCKET }}
      IMAGE_S3_REGION: ${{ vars.IMAGE_S3_REGION }}
      IMAGE_S3_KEY_PREFIX: ${{ vars.IMAGE_S3_KEY_PREFIX }}
      IMAGE_S3_PUBLIC_BASE_URL: ${{ vars.IMAGE_S3_PUBLIC_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR 로그인
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      # 직전 성공 태그는 배포가 점검까지 통과할 때만 서버 파일에 기록한다.
      # 처음 배포하는 서버에는 기록이 없으므로 실패해도 되돌릴 곳이 없다.
      - name: 직전 성공 태그 확인
        id: previous
        run: |
          file="${HOME}/${LAST_SUCCESS_FILE}"
          tag=""
          if [ -f "${file}" ]; then
            tag="$(cat "${file}")"
          fi
          echo "직전 성공 태그: ${tag:-없음}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Backend 이미지 받기
        run: docker pull "${BACKEND_IMAGE}:${BACKEND_TAG}"

      - name: Compose로 Backend 교체
        id: swap
        run: |
          unset COMPOSE_PROJECT_NAME
          docker compose \
            -f infra/docker-compose.dev.yml \
            up -d --no-build backend

      - name: 배포 후 점검(readiness 대기, 스모크 테스트)
        run: bash infra/scripts/verify-backend.sh dev

      - name: 성공 태그 기록
        run: |
          file="${HOME}/${LAST_SUCCESS_FILE}"
          mkdir -p "$(dirname "${file}")"
          echo "${BACKEND_TAG}" > "${file}"
          echo "배포 성공: ${BACKEND_IMAGE}:${BACKEND_TAG}"

      - name: 실패한 컨테이너 로그
        if: failure() && steps.swap.outcome != 'skipped'
        run: |
          docker compose -f infra/docker-compose.dev.yml logs --no-color --tail 80 backend || true

      # 이미지를 받지 못해 교체 전에 멈췄다면 컨테이너는 그대로이므로 되돌리지 않는다.
      - name: 직전 성공 태그로 롤백
        if: >-
          failure()
          && steps.swap.outcome != 'skipped'
          && steps.previous.outputs.tag != ''
          && steps.previous.outputs.tag != env.BACKEND_TAG
        env:
          ROLLBACK_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          echo "::error::배포 후 점검에 실패해 ${ROLLBACK_TAG}로 되돌린다."
          docker image inspect "${BACKEND_IMAGE}:${ROLLBACK_TAG}" > /dev/null 2>&1 \
            || docker pull "${BACKEND_IMAGE}:${ROLLBACK_TAG}"
          unset COMPOSE_PROJECT_NAME
          BACKEND_TAG="${ROLLBACK_TAG}" docker compose \
            -f infra/docker-compose.dev.yml \
            up -d --no-build backend
          bash infra/scripts/verify-backend.sh dev
          echo "::error::${ROLLBACK_TAG}로 복구했다. 이 배포(${BACKEND_TAG})는 실패로 남긴다."

      - name: GHCR 로그아웃
        if: always()
        run: docker logout ghcr.io

      # 이 저장소가 만든 이미지 중 실행 중이 아니고 일주일이 지난 것만 지운다.
      # 필터 없는 prune -a는 되돌아갈 이미지까지 지우므로 쓰지 않는다. 지운 이미지도 GHCR에 남아 있다.
      - name: 오래된 Backend 이미지 정리
        run: |
          docker image prune -af \
            --filter "until=168h" \
            --filter "label=org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"


  group-calendar-backfill:
    name: Group calendar backfill (development)
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/develop'
      && inputs.operation == 'group-calendar-backfill'
    runs-on: [jarihana-dev]
    environment: dev
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RDS_HOST: ${{ vars.RDS_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      PGPORT: "5432"
      PGDATABASE: jarihana_dev
      PGSSLMODE: require
      BATCH_SIZE: ${{ inputs.batch_size }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PostgreSQL client 준비
        run: docker pull postgres:17-alpine

      - name: 개발 DB 확인 후 작은 구간별 백필
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/develop" || "${PGDATABASE}" != "jarihana_dev" ]]; then
            echo "::error::이 작업은 develop 브랜치의 jarihana_dev 데이터베이스에서만 실행할 수 있다."
            exit 1
          fi
          if [[ ! "${BATCH_SIZE}" =~ ^(25|50|100)$ ]]; then
            echo "::error::허용하지 않는 batch_size다."
            exit 1
          fi
          : "${RDS_HOST:?dev 환경의 RDS_URL이 필요하다}"
          : "${DB_USERNAME:?dev 환경의 DB_USERNAME이 필요하다}"
          : "${DB_PASSWORD:?dev 환경의 DB_PASSWORD가 필요하다}"

          export PGHOST="${RDS_HOST}"
          export PGUSER="${DB_USERNAME}"
          export PGPASSWORD="${DB_PASSWORD}"

          psql_dev() {
            docker run --rm --network host \
              -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE \
              postgres:17-alpine psql -X -v ON_ERROR_STOP=1 "$@"
          }

          schema_ready="$(psql_dev -At -c "
            SELECT current_database() = 'jarihana_dev'
              AND to_regclass('public.groups') IS NOT NULL
              AND to_regclass('public.group_event') IS NOT NULL
              AND to_regclass('public.group_recurring_series') IS NOT NULL
              AND to_regclass('public.group_recurring_schedule_period') IS NOT NULL
              AND to_regclass('public.group_location_history') IS NOT NULL;
          ")"
          if [[ "${schema_ready}" != "t" ]]; then
            echo "::error::개발 DB 이름 또는 캘린더 스키마가 예상과 다르다. 백필을 시작하지 않았다."
            exit 1
          fi

          sql_file="backend/db/migrations/2026-10-07-group-calendar-backfill-batch.sql"
          if [[ ! -f "${sql_file}" ]]; then
            echo "::error::백필 SQL 파일을 찾을 수 없다: ${sql_file}"
            exit 1
          fi

          ranges="$(psql_dev -At -F '|' -c "
            SELECT MIN(id)::text || '|' || MAX(id)::text
            FROM (
              SELECT id,
                     (row_number() OVER (ORDER BY id) - 1) / ${BATCH_SIZE} AS batch_number
              FROM groups
            ) numbered_groups
            GROUP BY batch_number
            ORDER BY batch_number;
          ")"

          if [[ -z "${ranges}" ]]; then
            echo "개발 DB에 모임이 없어 백필할 데이터가 없다."
            exit 0
          fi

          batch_number=0
          while IFS='|' read -r batch_start_id batch_end_id; do
            [[ -n "${batch_start_id}" ]] || continue
            if [[ ! "${batch_start_id}" =~ ^[0-9]+$ || ! "${batch_end_id}" =~ ^[0-9]+$ ]]; then
              echo "::error::DB에서 읽은 모임 ID 구간이 숫자가 아니다."
              exit 1
            fi

            batch_number=$((batch_number + 1))
            rendered_sql="${RUNNER_TEMP}/group-calendar-backfill-${batch_number}.sql"
            sed \
              -e "s/BATCH_START_ID/${batch_start_id}/g" \
              -e "s/BATCH_END_ID/${batch_end_id}/g" \
              "${sql_file}" > "${rendered_sql}"

            echo "백필 구간 ${batch_number}: group ID ${batch_start_id}–${batch_end_id}"
            psql_dev -f "${rendered_sql}"
            rm -f "${rendered_sql}"
          done <<< "${ranges}"

          remaining="$(psql_dev -At -F '|' -c "
            SELECT
              (SELECT COUNT(*) FROM groups g
               WHERE NOT EXISTS (
                 SELECT 1 FROM group_location_history h WHERE h.group_id = g.id
               ))::text || '|' ||
              (SELECT COUNT(*) FROM groups g
               WHERE g.recurring_activity_days IS NOT NULL
                 AND NOT EXISTS (
                   SELECT 1
                   FROM group_recurring_series s
                   WHERE s.group_id = g.id AND s.is_current
                     AND EXISTS (
                       SELECT 1 FROM group_recurring_schedule_period p WHERE p.series_id = s.id
                     )
                 ))::text;
          ")"
          IFS='|' read -r groups_without_location recurring_groups_without_schedule <<< "${remaining}"
          if [[ "${groups_without_location}" != "0" || "${recurring_groups_without_schedule}" != "0" ]]; then
            echo "::error::백필 검증 실패: 장소 이력 누락 ${groups_without_location}, 정기 규칙 누락 ${recurring_groups_without_schedule}"
            exit 1
          fi

          echo "개발 DB 백필 완료: ${batch_number}개 구간 처리, 장소 이력과 정기 규칙 검증 통과"
