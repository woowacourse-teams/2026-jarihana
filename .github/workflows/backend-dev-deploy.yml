name: Backend Development Deploy

on:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "infra/docker-compose.dev.yml"
      - "infra/monitoring/alloy/config.alloy"
      - "infra/monitoring/alloy/postgres-queries.yaml"
      - "infra/scripts/verify-backend.sh"
      - "infra/scripts/deploy/**"
      - "infra/deploy/controller/**"
      - ".github/workflows/backend-dev-deploy.yml"
      - ".github/workflows/backend-bluegreen-deploy.yml"
      - ".github/workflows/backend-app-operation.yml"
      - ".github/workflows/backend-bluegreen-phase.yml"
  workflow_dispatch:
    inputs:
      blue_green_mode:
        description: 'legacy=기존 배포, bootstrap=최초 권한 등록, deploy=수동 Blue-Green 검증'
        type: choice
        options: [legacy, bootstrap, deploy]
        default: legacy
      image_tag:
        description: "다시 배포할 기존 이미지 태그(커밋 SHA). 비우면 현재 커밋을 빌드해 배포한다."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

env:
  # dev와 prod가 같은 이미지를 쓴다. prod는 main의 backend 트리 해시로 이 이미지를 찾아 받는다.
  BACKEND_IMAGE: ghcr.io/woowacourse-teams/jarihana-backend

jobs:
  # 이미지는 GitHub 호스팅 ARM runner에서 빌드해 GHCR에 올린다. 서버는 빌드하지 않는다.
  build:
    if: github.ref == 'refs/heads/develop' && inputs.image_tag == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      # 회귀 테스트는 PR CI(ci.yml의 Backend Test)에서 실행한다.
      # develop 규칙(ci-rule)은 최신 develop을 반영한 PR의 테스트 통과를 병합 조건으로 요구하며, 우회 대상은 없다.
      # 배포에서는 테스트를 반복하지 않고 jar를 빌드한다. Dockerfile은 이 jar를 복사한다.
      - name: Backend jar 빌드
        working-directory: backend
        run: ./gradlew bootJar --no-daemon

      - name: GHCR 로그인
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      # 커밋 SHA 태그는 실행 중인 컨테이너를 커밋에 잇는다.
      # 트리 해시 태그는 squash나 merge commit으로 main에 들어가도 backend 코드가 같으면 같은 값이라,
      # prod가 다시 빌드하지 않고 이 이미지를 찾는 데 쓴다.
      - name: Backend 트리 해시 계산
        run: echo "BACKEND_TREE=$(git rev-parse HEAD:backend)" >> "${GITHUB_ENV}"

      # runner는 매번 새로 만들어져 로컬 레이어 캐시가 없다. 그래서 이미지 안에 캐시 정보를 담고(inline),
      # 다음 빌드는 buildcache 태그가 가리키는 직전 develop 이미지에서 그 정보를 읽는다.
      # buildcache 태그는 캐시를 읽는 데만 쓰고 배포에는 쓰지 않는다. 태그가 없으면 캐시 없이 빌드한다.
      # 캐시가 맞은 레이어(yum, useradd, OTel agent, 의존성)는 직전 이미지와 digest가 같아 push와 서버 pull에서 건너뛴다.
      # inline은 최종 이미지의 레이어만 캐시한다. jar를 푸는 앞 단계는 jar가 바뀔 때마다 다시 실행되므로 캐시할 이유가 없다.
      # 캐시가 GHCR 이미지에 함께 있어 GitHub Actions 캐시처럼 7일 동안 안 쓰면 지워지거나 따로 용량을 쓰지 않는다.
      # provenance를 끄면 이전과 같은 단일 이미지 manifest를 올린다.
      - name: Backend 이미지 빌드와 GHCR push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          provenance: false
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.BACKEND_TAG }}
            ${{ env.BACKEND_IMAGE }}:tree-${{ env.BACKEND_TREE }}
            ${{ env.BACKEND_IMAGE }}:buildcache
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.BACKEND_TAG }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=inline

  # dev EC2의 runner는 GHCR에서 이미지를 받아 컨테이너만 교체한다.
  # 교체 뒤 readiness 대기와 스모크 테스트를 하고, 실패하면 직전 성공 태그로 되돌린 뒤 실패로 끝낸다.
  # image_tag를 넣어 수동 실행하면 빌드를 건너뛰고 그 태그로 다시 배포한다. 없는 태그면 받기에서 실패한다.
  deploy:
    needs: build
    if: >-
      always()
      && github.ref == 'refs/heads/develop'
      && inputs.blue_green_mode != 'bootstrap' && inputs.blue_green_mode != 'deploy'
      && (needs.build.result == 'success'
        || (needs.build.result == 'skipped' && inputs.image_tag != ''))
    runs-on: [jarihana-dev]
    environment: dev
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    # 배포와 롤백이 같은 Compose 명령을 쓰므로 실행 값은 job 단위로 둔다.
    env:
      BACKEND_TAG: ${{ inputs.image_tag || github.sha }}
      # runner 계정의 홈 디렉터리 기준 경로
      LAST_SUCCESS_FILE: .jarihana/backend-dev-last-success
      RDS_URL: ${{ vars.RDS_URL }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FLYWAY_BASELINE_ON_MIGRATE: ${{ vars.FLYWAY_BASELINE_ON_MIGRATE || 'false' }}
      INVITATION_TOKEN_ACTIVE_KEY_ID: ${{ vars.INVITATION_TOKEN_ACTIVE_KEY_ID || 'primary' }}
      INVITATION_TOKEN_KEY_PRIMARY: ${{ secrets.INVITATION_TOKEN_KEY_PRIMARY }}
      INVITATION_TOKEN_KEY_PREVIOUS: ${{ secrets.INVITATION_TOKEN_KEY_PREVIOUS }}
      PUSH_ENABLED: ${{ vars.PUSH_ENABLED || 'false' }}
      PUSH_WORKER_ENABLED: ${{ vars.PUSH_WORKER_ENABLED || 'true' }}
      PUSH_VAPID_PUBLIC_KEY: ${{ vars.PUSH_VAPID_PUBLIC_KEY }}
      PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
      PUSH_VAPID_SUBJECT: ${{ vars.PUSH_VAPID_SUBJECT }}
      SENTRY_BACKEND_DSN: ${{ vars.SENTRY_BACKEND_DSN }}
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
      GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
      GITHUB_OAUTH_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
      IMAGE_S3_BUCKET: ${{ vars.IMAGE_S3_BUCKET }}
      IMAGE_S3_REGION: ${{ vars.IMAGE_S3_REGION }}
      IMAGE_S3_KEY_PREFIX: ${{ vars.IMAGE_S3_KEY_PREFIX }}
      IMAGE_S3_PUBLIC_BASE_URL: ${{ vars.IMAGE_S3_PUBLIC_BASE_URL }}
      IMAGE_CDN_DELIVERY_BASE_URL: ${{ vars.IMAGE_CDN_DELIVERY_BASE_URL }}
      IMAGE_CLOUDFRONT_KEY_PAIR_ID: ${{ vars.IMAGE_CLOUDFRONT_KEY_PAIR_ID }}
      IMAGE_CLOUDFRONT_PRIVATE_KEY: ${{ secrets.IMAGE_CLOUDFRONT_PRIVATE_KEY }}
      IMAGE_CLEANUP_ENABLED: ${{ vars.IMAGE_CLEANUP_ENABLED || 'false' }}
      IMAGE_CLEANUP_GRACE_PERIOD: P7D
      MONITORING_BIND_ADDRESS: ${{ vars.MONITORING_BIND_ADDRESS }}
      HOST_ID: ${{ vars.HOST_ID || 'jarihana-dev-ec2' }}
      PROMETHEUS_REMOTE_WRITE_URL: http://${{ vars.MONITORING_BIND_ADDRESS }}:8080/prometheus/api/v1/write
      LOKI_PUSH_URL: http://${{ vars.MONITORING_BIND_ADDRESS }}:8080/loki/api/v1/push
      POSTGRES_MONITOR_DSN: ${{ secrets.POSTGRES_MONITOR_DSN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR 로그인
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      # 직전 성공 태그는 배포가 점검까지 통과할 때만 서버 파일에 기록한다.
      # 처음 배포하는 서버에는 기록이 없으므로 실패해도 되돌릴 곳이 없다.
      - name: 직전 성공 태그 확인
        id: previous
        run: |
          file="${HOME}/${LAST_SUCCESS_FILE}"
          tag=""
          if [ -f "${file}" ]; then
            tag="$(cat "${file}")"
          fi
          echo "직전 성공 태그: ${tag:-없음}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Backend 이미지 받기
        run: docker pull "${BACKEND_IMAGE}:${BACKEND_TAG}"

      - name: 모니터링 배포 입력 확인
        run: |
          for name in MONITORING_BIND_ADDRESS HOST_ID POSTGRES_MONITOR_DSN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::dev environment is missing ${name}"
              exit 1
            fi
          done

      - name: Alloy 이미지와 설정 검증
        run: |
          unset COMPOSE_PROJECT_NAME
          docker compose \
            -f infra/docker-compose.dev.yml \
            pull alloy
          docker compose \
            -f infra/docker-compose.dev.yml \
            run --rm --no-deps alloy validate /etc/alloy/config.alloy

      - name: Compose로 Backend 교체
        id: swap
        run: |
          unset COMPOSE_PROJECT_NAME
          docker compose \
            -f infra/docker-compose.dev.yml \
            up -d --no-build --force-recreate backend alloy

      - name: 배포 후 점검(readiness 대기, 스모크 테스트)
        run: bash infra/scripts/verify-backend.sh dev

      - name: Alloy readiness 확인
        run: |
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 \
            http://127.0.0.1:12345/-/ready > /dev/null

      - name: 성공 태그 기록
        run: |
          file="${HOME}/${LAST_SUCCESS_FILE}"
          mkdir -p "$(dirname "${file}")"
          echo "${BACKEND_TAG}" > "${file}"
          echo "배포 성공: ${BACKEND_IMAGE}:${BACKEND_TAG}"

      - name: 실패한 컨테이너 로그
        if: failure() && steps.swap.outcome != 'skipped'
        run: |
          docker compose -f infra/docker-compose.dev.yml logs --no-color --tail 80 backend || true

      # 이미지를 받지 못해 교체 전에 멈췄다면 컨테이너는 그대로이므로 되돌리지 않는다.
      - name: 직전 성공 태그로 롤백
        if: >-
          failure()
          && steps.swap.outcome != 'skipped'
          && steps.previous.outputs.tag != ''
          && steps.previous.outputs.tag != env.BACKEND_TAG
        env:
          ROLLBACK_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          echo "::error::배포 후 점검에 실패해 ${ROLLBACK_TAG}로 되돌린다."
          docker image inspect "${BACKEND_IMAGE}:${ROLLBACK_TAG}" > /dev/null 2>&1 \
            || docker pull "${BACKEND_IMAGE}:${ROLLBACK_TAG}"
          unset COMPOSE_PROJECT_NAME
          BACKEND_TAG="${ROLLBACK_TAG}" docker compose \
            -f infra/docker-compose.dev.yml \
            up -d --no-build --force-recreate backend alloy
          bash infra/scripts/verify-backend.sh dev
          curl --fail --silent --show-error \
            --retry 20 --retry-all-errors --retry-delay 3 --max-time 5 \
            http://127.0.0.1:12345/-/ready > /dev/null
          echo "::error::${ROLLBACK_TAG}로 복구했다. 이 배포(${BACKEND_TAG})는 실패로 남긴다."

      - name: GHCR 로그아웃
        if: always()
        run: docker logout ghcr.io

      # 이 저장소가 만든 이미지 중 실행 중이 아니고 일주일이 지난 것만 지운다.
      # 필터 없는 prune -a는 되돌아갈 이미지까지 지우므로 쓰지 않는다. 지운 이미지도 GHCR에 남아 있다.
      - name: 오래된 Backend 이미지 정리
        run: |
          docker image prune -af \
            --filter "until=168h" \
            --filter "label=org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"

  blue-green:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' &&
      (inputs.blue_green_mode == 'bootstrap' || inputs.blue_green_mode == 'deploy') &&
      (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.image_tag != ''))
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/backend-bluegreen-deploy.yml
    with:
      environment: dev
      image_tag: ${{ inputs.image_tag || github.sha }}
      mode: ${{ inputs.blue_green_mode }}
    secrets: inherit
