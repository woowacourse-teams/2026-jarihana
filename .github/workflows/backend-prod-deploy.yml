name: Backend Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "infra/docker-compose.yml"
      - ".github/workflows/backend-prod-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64]
    environment: prod
    timeout-minutes: 20
    env:
      BACKEND_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker 확인
        run: |
          whoami
          docker version

      - name: Backend 이미지 빌드
        run: |
          docker build \
            -t jarihana-backend:${BACKEND_TAG} \
            ./backend

      - name: Compose로 Backend 배포
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
          IMAGE_S3_BUCKET: ${{ secrets.IMAGE_S3_BUCKET }}
          IMAGE_S3_REGION: ${{ secrets.IMAGE_S3_REGION }}
          IMAGE_S3_KEY_PREFIX: ${{ secrets.IMAGE_S3_KEY_PREFIX }}
          IMAGE_S3_PUBLIC_BASE_URL: ${{ secrets.IMAGE_S3_PUBLIC_BASE_URL }}
        run: |
          docker compose \
            -f infra/docker-compose.yml \
            up -d --no-build backend

      - name: Backend 컨테이너 상태 확인
        run: |
          container_id="$(docker ps -q --filter 'name=^/jarihana-backend$')"
          test -n "${container_id}"
          test "$(docker inspect -f '{{.State.Status}}' "${container_id}")" = "running"
          docker ps --filter 'name=^/jarihana-backend$'
