name: Production Release

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/frontend-prod-deploy.yml"
      - "infra/docker-compose.yml"
      - "infra/monitoring/alloy/config.alloy"
      - "infra/monitoring/alloy/postgres-queries.yaml"
      - "infra/scripts/verify-backend.sh"
      - "infra/blue-green-deploy/scripts/**"
      - "infra/blue-green-deploy/control/**"
      - ".github/workflows/backend-control-*.yml"
      - "infra/blue-green-deploy/controller/**"
      - "infra/blue-green-deploy/nginx/**"
      - ".github/workflows/backend-prod-deploy.yml"
      - ".github/workflows/backend-bluegreen-deploy.yml"
      - ".github/workflows/backend-app-operation.yml"
      - ".github/workflows/backend-bluegreen-phase.yml"
  workflow_dispatch:
    inputs:
      blue_green_mode:
        description: 'bootstrap=최초 권한 등록, deploy=프론트엔드와 백엔드 공동 배포'
        type: choice
        options: [bootstrap, deploy]
        default: deploy
      frontend_only:
        description: '현재 백엔드를 유지하고 프론트엔드만 배포 (Blue-Green deploy 전용)'
        type: boolean
        default: false
      backend_only:
        description: '현재 프론트엔드를 유지하고 백엔드만 배포 (Blue-Green deploy 전용)'
        type: boolean
        default: false
      image_tag:
        description: "기존 이미지 태그(커밋 SHA). deploy에서는 현재 main backend 트리와 같은 digest만 허용한다. bootstrap은 실제 실행 중인 이미지 태그를 지정한다."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Include control installation in the same lock as deployment and monitoring.
  group: jarihana-observed-deployment
  cancel-in-progress: false
  queue: max

jobs:
  release-enabled:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ENABLED: ${{ vars.BLUE_GREEN_PROD_ENABLED }}
      MODE: ${{ inputs.blue_green_mode || 'deploy' }}
    steps:
      - name: 새 운영 배포 허용 상태 확인
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$MODE" == bootstrap ]]; then exit 0; fi
          if [[ "$ENABLED" != true ]]; then
            echo '::error::새 운영 배포가 중단되어 있습니다. 현재 서비스는 유지하며 BLUE_GREEN_PROD_ENABLED=true 전에는 서버와 S3를 변경하지 않습니다.'
            exit 1
          fi
  control:
    needs: release-enabled
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/backend-control-upgrade.yml
    with:
      enabled: ${{ github.event_name == 'push' || inputs.blue_green_mode == 'deploy' }}
  queue-guardian:
    needs: release-enabled
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BG_QUEUE_TERMINAL_NAME: production-result
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 제어 교체부터 배포 완료까지 runner 대기 감시
        run: bash infra/blue-green-deploy/scripts/actions/queue-guard.sh
  blue-green:
    needs: [release-enabled, control]
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.BLUE_GREEN_PROD_ENABLED == 'true') ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.blue_green_mode == 'bootstrap' || inputs.blue_green_mode == 'deploy')))
    permissions:
      contents: read
      packages: read
      actions: write
    uses: ./.github/workflows/backend-bluegreen-deploy.yml
    with:
      control_ref: ${{ needs.control.outputs.control_ref }}
      parent_observed_lock: true
      environment: prod
      frontend_only: ${{ inputs.frontend_only || false }}
      backend_only: ${{ inputs.backend_only || false }}
      image_tag: ${{ inputs.image_tag }}
      mode: ${{ inputs.blue_green_mode || 'deploy' }}
    secrets: inherit
  result:
    name: production-result
    if: always()
    needs: [release-enabled, control, blue-green]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CONTROL_RESULT: ${{ needs.control.result }}
      DEPLOY_RESULT: ${{ needs.blue-green.result }}
    steps:
      - run: |
          if [[ "$CONTROL_RESULT" == failure || "$CONTROL_RESULT" == cancelled ]]; then
            echo '제어 버전 교체 실패: 앱 배포를 시작하지 않았습니다. control job의 복구 결과와 각 호스트의 /var/backups/jarihana-control/automatic/<run-id>를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$DEPLOY_RESULT" = success
