name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: PR 변경 범위
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/pr-ci-scope.sh "$GITHUB_EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # GitHub accepts skipped required checks. Only skip on an explicit, successful "false".
  backend:
    name: Backend Test
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.backend != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_CHECK: ${{ needs.changes.outputs.backend }}

    defaults:
      run:
        working-directory: backend

    steps:
      - &require_valid_scope
        name: 변경 감지 결과 검증
        if: needs.changes.result != 'success' || env.RUN_CHECK != 'true'
        working-directory: .
        run: |
          echo "::error::Missing or failed PR change detection"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 설정
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      - name: 백엔드 테스트
        run: ./gradlew test --no-daemon

  frontend:
    name: Frontend Verify
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_CHECK: ${{ needs.changes.outputs.frontend }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - *require_valid_scope
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: npm run lint

      - name: 테스트
        run: npm test -- --ci

      - name: 빌드
        env:
          APP_GITHUB_CLIENT_ID: ci-client
          APP_GITHUB_REDIRECT_URI: http://127.0.0.1:5173/api/oauth/github/callback
          APP_OAUTH_COOKIE_NAME: oauthState
          DISABLE_REACT_DEVTOOLS: "1"
        run: npm run build

  frontend-e2e:
    name: Frontend E2E
    needs: changes
    if: always() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_CHECK: ${{ needs.changes.outputs.e2e }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - *require_valid_scope
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 핵심 E2E
        run: npm run test:e2e:core

      - name: E2E 결과 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results
          path: |
            frontend/playwright-report
            frontend/test-results/e2e
          if-no-files-found: ignore
