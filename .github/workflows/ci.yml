name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches: [develop, main]
    paths:
      - backend/src/**/*.java
      - backend/**/*.gradle*
      - backend/gradle/**
      - backend/gradle.properties
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: ${{ github.event_name == 'push' && 'Backend Compile Cache' || format('Backend Test ({0}/3)', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'push' && '[1]' || '[1,2,3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 설정
        id: java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/**
            backend/gradle.properties

      # 같은 경로에서 클래스와 실행 이력을 함께 복원해야 Gradle이 증분 컴파일할 수 있다.
      # buildOutputCleanup의 기록이 빠지면 Gradle이 복원한 클래스를 오래된 출력으로 삭제한다.
      - name: Java 증분 컴파일 캐시
        id: compile-cache
        uses: actions/cache@v5
        env:
          COMPILE_ENV: ${{ runner.os }}-${{ runner.arch }}-${{ github.workspace }}-corretto-${{ steps.java.outputs.version }}
          BUILD_CONFIG: ${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/**', 'backend/gradle.properties') }}
        with:
          path: |
            backend/.gradle/*/executionHistory
            backend/.gradle/buildOutputCleanup
            backend/build/classes/java
            backend/build/generated/sources
            backend/build/tmp/compileJava/previous-compilation-data.bin
            backend/build/tmp/compileTestJava/previous-compilation-data.bin
          key: java-compile-v1-${{ env.COMPILE_ENV }}-${{ env.BUILD_CONFIG }}-${{ hashFiles('backend/src/**/*.java') }}
          restore-keys: java-compile-v1-${{ env.COMPILE_ENV }}-${{ env.BUILD_CONFIG }}-

      # 의존성 캐시가 비었으면 테스트 실행에만 쓰이는 라이브러리까지 내려받는다.
      - name: 기준 브랜치의 컴파일 결과와 테스트 의존성 준비
        if: github.event_name == 'push' && steps.java.outputs.cache-hit != 'true'
        run: ./gradlew test --test-dry-run --no-daemon

      - name: 기준 브랜치의 컴파일 결과 갱신
        if: github.event_name == 'push' && steps.java.outputs.cache-hit == 'true' && steps.compile-cache.outputs.cache-hit != 'true'
        run: ./gradlew testClasses --no-daemon

      - name: 백엔드 테스트
        if: github.event_name != 'push'
        run: ./gradlew test --rerun --no-daemon -Pshardpilot.count=3 -Pshardpilot.index=${{ matrix.shard }}

      - name: 벤치마크 테스트 목록 검증
        if: github.event_name != 'push'
        env:
          COMPILE_HIT: ${{ steps.compile-cache.outputs.cache-hit }}
          DEPENDENCIES_HIT: ${{ steps.java.outputs.cache-hit }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from xml.etree.ElementTree import parse

          total = skipped = failed = fingerprint = 0
          for path in Path('build/test-results/test').glob('TEST-*.xml'):
              suite = parse(path).getroot()
              skipped += int(suite.get('skipped', 0))
              failed += int(suite.get('errors', 0)) + int(suite.get('failures', 0))
              for case in suite.findall('testcase'):
                  identity = json.dumps([case.attrib['classname'], case.attrib['name']], ensure_ascii=False)
                  fingerprint += int.from_bytes(hashlib.sha256(identity.encode()).digest(), 'big')
                  total += 1
          assert total > 0 and failed == 0 and skipped == 0, (total, failed, skipped)
          print('BENCH_RESULT', total, format(fingerprint % (1 << 256), '064x'),
                os.environ['COMPILE_HIT'] or 'miss', os.environ['DEPENDENCIES_HIT'] or 'miss',
                os.environ['BASE_SHA'])
          PY

  backend-result:
    name: Backend Test
    if: ${{ always() && github.event_name != 'push' }}
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: 모든 테스트 그룹 결과 확인
        env:
          RESULT: ${{ needs.backend.result }}
        run: test "$RESULT" = success

  frontend:
    if: github.event_name != 'push'
    name: Frontend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: npm run lint

      - name: 테스트
        run: npm test -- --ci

      - name: 빌드
        env:
          APP_GITHUB_CLIENT_ID: ci-client
          APP_GITHUB_REDIRECT_URI: http://127.0.0.1:5173/api/oauth/github/callback
          APP_OAUTH_COOKIE_NAME: oauthState
          DISABLE_REACT_DEVTOOLS: "1"
        run: npm run build

  frontend-e2e:
    if: github.event_name != 'push'
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 핵심 E2E
        run: npm run test:e2e:core

      - name: E2E 결과 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-results
          path: |
            frontend/playwright-report
            frontend/test-results/e2e
          if-no-files-found: ignore
