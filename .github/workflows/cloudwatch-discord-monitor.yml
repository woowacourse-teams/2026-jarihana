name: CloudWatch Discord Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudwatch-discord-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 2
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_PAGER: ""
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CloudWatch alarms and notify Discord
        run: python3 infra/cloudwatch/discord-monitor.py
