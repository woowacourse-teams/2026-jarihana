name: Conditional Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
    branches: [develop, main]
  workflow_run:
    workflows: [Review Policy Review Events]
    types: [completed]
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

# Serialize scans so an older evaluation cannot overwrite a newer result.
# Each run reads all open PRs, including events coalesced while a run was pending.
concurrency:
  group: conditional-review-gate
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate review policy
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish review policy statuses and migration checks
        uses: actions/github-script@v7
        env:
          REVIEW_GATE_LEGACY_CHECKS: ${{ vars.REVIEW_GATE_LEGACY_CHECKS }}
        with:
          script: |
            const { publishReviewGate } = require(
              process.env.GITHUB_WORKSPACE + "/.github/scripts/publish-review-gate.cjs"
            );
            await publishReviewGate({ github, context, core });
