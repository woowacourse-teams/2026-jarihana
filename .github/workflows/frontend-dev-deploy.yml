name: Frontend Development Deploy

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-dev-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dev-deploy
  cancel-in-progress: false

jobs:
  # 빌드는 GitHub 호스팅 runner에서 한다. 서버의 runner는 결과물을 받아 S3에 올리기만 한다.
  # 결과물은 정적 파일이라 빌드 runner의 아키텍처와 상관없다.
  build:
    if: github.ref == 'refs/heads/develop'
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: |
          npm run lint
          npm run typecheck

      - name: 개발 환경 변수 확인
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
        run: |
          set -euo pipefail
          test -n "${APP_GITHUB_CLIENT_ID}"
          test -n "${APP_GITHUB_REDIRECT_URI}"

      - name: 프론트엔드 빌드
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
          APP_OAUTH_COOKIE_NAME: oauthState
          DISABLE_REACT_DEVTOOLS: "1"
          APP_ANALYTICS_ENABLED: "false"
          APP_DEPLOY_ENV: development
        run: |
          set -euo pipefail
          npm run build
          test -f dist/index.html
          test -d dist/assets
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/icons/pwa-192.png
          test -s dist/icons/pwa-512.png

      - name: 빌드 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # S3 쓰기 권한은 EC2의 IAM 역할에만 있으므로 올리는 일만 self-hosted runner에 남긴다.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: dev
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_PAGER: ""
      S3_DESTINATION: s3://techcourse-project-2026/jarihana-dev/frontend

    steps:
      - name: AWS 배포 대상 확인
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          aws s3api head-bucket \
            --bucket techcourse-project-2026 \
            --region "${AWS_REGION}"

      # self-hosted runner의 작업 디렉터리는 실행 사이에 남는다.
      # 이전 결과물이 섞이면 sync --delete가 엉뚱한 파일을 올리므로 먼저 비운다.
      - name: 이전 빌드 결과 비우기
        run: rm -rf dist

      - name: 빌드 결과 받기
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: 빌드 결과 확인
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          test -s dist/sw.js
          test -s dist/manifest.webmanifest

      - name: S3 배포
        run: aws s3 sync dist "${S3_DESTINATION}" --delete --region "${AWS_REGION}" --only-show-errors

      - name: PWA 파일의 응답 메타데이터 지정
        run: |
          set -euo pipefail
          aws s3 cp dist/sw.js "${S3_DESTINATION}/sw.js" --region "${AWS_REGION}" --only-show-errors --content-type "text/javascript; charset=utf-8" --cache-control "no-cache, max-age=0, must-revalidate"
          aws s3 cp dist/manifest.webmanifest "${S3_DESTINATION}/manifest.webmanifest" --region "${AWS_REGION}" --only-show-errors --content-type "application/manifest+json" --cache-control "no-cache, max-age=0, must-revalidate"
          aws s3 cp dist/icons "${S3_DESTINATION}/icons" --recursive --region "${AWS_REGION}" --only-show-errors --content-type "image/png" --cache-control "no-cache, max-age=0, must-revalidate"
