name: Frontend Production Build
on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: 이 빌드를 요청한 운영 배포 실행 ID
        type: string
        required: true
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    environment: prod
    runs-on: ${{ inputs.source_sha && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    timeout-minutes: ${{ inputs.source_sha && 15 || 25 }}
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: 배포 소스 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: 운영 배포가 검증한 소스 커밋 확인
        if: inputs.source_sha == ''
        id: parent
        uses: actions/github-script@v7
        env:
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
        with:
          script: |
            const { parentSourceSha } = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/production-frontend-build.cjs');
            const sha = await parentSourceSha({ github, context, parentRunId: process.env.PARENT_RUN_ID });
            core.setOutput('source_sha', sha);

      - name: 빌드 대기 중 main이 바뀌면 부모 배포 커밋 가져오기
        if: steps.parent.outputs.source_sha != '' && steps.parent.outputs.source_sha != github.sha
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.parent.outputs.source_sha }}
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: |
          npm run lint

      - name: 운영 환경 변수 확인
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
        run: |
          set -euo pipefail
          test -n "${APP_GITHUB_CLIENT_ID}"
          test -n "${APP_GITHUB_REDIRECT_URI}"

      - name: 프론트엔드 빌드
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
          APP_SENTRY_DSN: ${{ vars.SENTRY_FRONTEND_DSN }}
          APP_SENTRY_RELEASE: ${{ steps.parent.outputs.source_sha || inputs.source_sha }}
          APP_OAUTH_COOKIE_NAME: oauthState
          DISABLE_REACT_DEVTOOLS: "1"
          APP_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          APP_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          APP_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'false' }}
          APP_DEPLOY_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm run build
          npm run clean:sourcemaps
          test -f dist/index.html
          test -d dist/assets
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/icons/pwa-192.png
          test -s dist/icons/pwa-512.png

      - name: 빌드 결과 올리기
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ steps.parent.outputs.source_sha || inputs.source_sha }}-${{ inputs.parent_run_id || github.run_id }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
