name: Frontend Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-prod-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-prod-deploy
  cancel-in-progress: false

jobs:
  # 빌드는 GitHub 호스팅 runner에서 한다. 서버의 runner는 결과물을 받아 S3에 올리기만 한다.
  # 결과물은 정적 파일이라 빌드 runner의 아키텍처와 상관없다.
  build:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: |
          npm run lint
          npm run typecheck

      - name: 운영 환경 변수 확인
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
        run: |
          set -euo pipefail
          test -n "${APP_GITHUB_CLIENT_ID}"
          test -n "${APP_GITHUB_REDIRECT_URI}"

      - name: 프론트엔드 빌드
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
          APP_SENTRY_DSN: ${{ vars.SENTRY_FRONTEND_DSN }}
          APP_SENTRY_RELEASE: ${{ github.sha }}
          APP_OAUTH_COOKIE_NAME: oauthState
          DISABLE_REACT_DEVTOOLS: "1"
          APP_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          APP_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          APP_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'false' }}
          APP_DEPLOY_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm run build
          npm run clean:sourcemaps
          test -f dist/index.html
          test -d dist/assets
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/icons/pwa-192.png
          test -s dist/icons/pwa-512.png

      - name: 빌드 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  # prod A/B 공통 라벨 준비 전에는 기존 runner를 유지한다. 인증은 EC2 IAM을 쓴다.
  # 업로드 도중 Blue-Green이 runner 호스트를 중지하지 않도록 같은 잠금을 사용한다.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ${{ vars.FRONTEND_PROD_DEPLOY_RUNNER || 'jarihana-prod' }}
    concurrency:
      group: jarihana-observed-deployment
      cancel-in-progress: false
      queue: max
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_PAGER: ""
      S3_DESTINATION: s3://techcourse-project-2026/jarihana/frontend

    steps:
      - name: AWS CLI 확인과 누락 시 고정 버전 준비
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then
            cli_version="$(aws --version)"
            echo "${cli_version}"
            if [[ "${cli_version}" != aws-cli/2.* ]]; then
              echo "::error::기존 AWS CLI는 v2여야 합니다."
              exit 1
            fi
            exit 0
          fi
          if [[ "$(uname -s)" != Linux || "$(uname -m)" != aarch64 ]]; then
            echo "::error::prod 배포 runner는 Linux ARM64여야 합니다."
            exit 1
          fi
          cli_temp="$(mktemp -d "${RUNNER_TEMP}/frontend-awscli.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://awscli.amazonaws.com/awscli-exe-linux-aarch64-2.38.5.zip \
            --output "${cli_temp}/awscliv2.zip"
          echo "07711a936e9d271045ab937d2c2c5390c25f419e4ba9e25adb9e996031e3f6be  ${cli_temp}/awscliv2.zip" | sha256sum --check
          unzip -q "${cli_temp}/awscliv2.zip" -d "${cli_temp}"
          "${cli_temp}/aws/install" --install-dir "${cli_temp}/install" --bin-dir "${cli_temp}/bin"
          cli_version="$("${cli_temp}/bin/aws" --version)"
          echo "${cli_version}"
          [[ "${cli_version}" == aws-cli/2.38.5\ * ]]
          echo "${cli_temp}/bin" >> "${GITHUB_PATH}"

      - name: AWS 배포 대상 확인
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          aws s3api head-bucket \
            --bucket techcourse-project-2026 \
            --region "${AWS_REGION}"

      # self-hosted runner의 작업 디렉터리는 실행 사이에 남는다.
      # 이전 결과물이 섞이면 sync --delete가 엉뚱한 파일을 올리므로 먼저 비운다.
      - name: 이전 빌드 결과 비우기
        run: rm -rf dist

      - name: 빌드 결과 받기
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: 빌드 결과 확인
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          test -s dist/sw.js
          test -s dist/manifest.webmanifest

      - name: S3 배포
        run: aws s3 sync dist "${S3_DESTINATION}" --delete --region "${AWS_REGION}" --only-show-errors

      - name: PWA 파일의 응답 메타데이터 지정
        run: |
          set -euo pipefail
          aws s3 cp dist/sw.js "${S3_DESTINATION}/sw.js" --region "${AWS_REGION}" --only-show-errors --content-type "text/javascript; charset=utf-8" --cache-control "no-cache, max-age=0, must-revalidate"
          aws s3 cp dist/manifest.webmanifest "${S3_DESTINATION}/manifest.webmanifest" --region "${AWS_REGION}" --only-show-errors --content-type "application/manifest+json" --cache-control "no-cache, max-age=0, must-revalidate"
          aws s3 cp dist/icons "${S3_DESTINATION}/icons" --recursive --region "${AWS_REGION}" --only-show-errors --content-type "image/png" --cache-control "no-cache, max-age=0, must-revalidate"
