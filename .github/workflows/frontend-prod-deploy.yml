name: Frontend Production Build
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 정적 검사
        run: |
          npm run lint
          npm run typecheck

      - name: 운영 환경 변수 확인
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
        run: |
          set -euo pipefail
          test -n "${APP_GITHUB_CLIENT_ID}"
          test -n "${APP_GITHUB_REDIRECT_URI}"

      - name: 프론트엔드 빌드
        env:
          APP_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GITHUB_CLIENT_ID }}
          APP_GITHUB_REDIRECT_URI: ${{ vars.OAUTH_GITHUB_REDIRECT_URI }}
          APP_SENTRY_DSN: ${{ vars.SENTRY_FRONTEND_DSN }}
          APP_SENTRY_RELEASE: ${{ inputs.source_sha }}
          APP_OAUTH_COOKIE_NAME: oauthState
          DISABLE_REACT_DEVTOOLS: "1"
          APP_POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          APP_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          APP_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'false' }}
          APP_DEPLOY_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          npm run build
          npm run clean:sourcemaps
          test -f dist/index.html
          test -d dist/assets
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/icons/pwa-192.png
          test -s dist/icons/pwa-512.png

      - name: 빌드 결과 올리기
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-${{ inputs.source_sha }}-${{ github.run_id }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7
