name: Frontend S3 Access Check

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend-s3-access-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on:
      - self-hosted
      - Linux
      - ARM64
    timeout-minutes: 5
    env:
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_PAGER: ""
      S3_BUCKET: techcourse-project-2026
      S3_PREFIX: jarihana/frontend

    steps:
      - name: AWS 실행 주체와 대상 파일 확인
        shell: bash
        run: |
          set -euo pipefail
          aws --version
          aws sts get-caller-identity
          aws s3 ls \
            "s3://${S3_BUCKET}/${S3_PREFIX}/" \
            --recursive \
            --region "${AWS_REGION}"

      - name: 임시 객체 쓰기와 삭제 확인
        shell: bash
        run: |
          set -euo pipefail

          test_file="$(mktemp)"
          test_key="${S3_PREFIX}/_deploy-checks/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          test_uri="s3://${S3_BUCKET}/${test_key}"

          cleanup() {
            aws s3 rm "${test_uri}" \
              --region "${AWS_REGION}" \
              --only-show-errors >/dev/null 2>&1 || true
            rm -f "${test_file}"
          }
          trap cleanup EXIT

          printf 'run_id=%s\nrun_attempt=%s\ncommit=%s\n' \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" \
            "${GITHUB_SHA}" > "${test_file}"

          aws s3 cp \
            "${test_file}" \
            "${test_uri}" \
            --content-type text/plain \
            --region "${AWS_REGION}" \
            --only-show-errors

          if ! aws s3 ls "${test_uri}" --region "${AWS_REGION}" | grep -q .; then
            echo "::error::임시 객체 업로드를 확인하지 못했습니다: ${test_uri}"
            exit 1
          fi

          aws s3 rm \
            "${test_uri}" \
            --region "${AWS_REGION}" \
            --only-show-errors

          if aws s3 ls "${test_uri}" --region "${AWS_REGION}" | grep -q .; then
            echo "::error::임시 객체가 삭제되지 않았습니다: ${test_uri}"
            exit 1
          fi

          rm -f "${test_file}"
          trap - EXIT
