name: Infrastructure Docker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "infra/docker-compose.yml"
      - ".github/workflows/infra-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose로 PostgreSQL 배포
        env:
          BACKEND_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GITHUB_OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
          IMAGE_S3_BUCKET: ${{ secrets.IMAGE_S3_BUCKET }}
          IMAGE_S3_REGION: ${{ secrets.IMAGE_S3_REGION }}
          IMAGE_S3_KEY_PREFIX: ${{ secrets.IMAGE_S3_KEY_PREFIX }}
          IMAGE_S3_PUBLIC_BASE_URL: ${{ secrets.IMAGE_S3_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          docker compose \
            -f infra/docker-compose.yml \
            up -d --no-build --no-deps --wait --wait-timeout 60 postgres
