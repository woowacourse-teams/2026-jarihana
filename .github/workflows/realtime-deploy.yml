name: Realtime Deploy

on:
  pull_request:
    branches: [develop]
    paths:
      - "realtime/**"
      - "infra/realtime/**"
      - "!realtime/*.md"
      - "!realtime/.gitignore"
      - "!infra/realtime/*.md"
      - "!infra/realtime/.env.example"
      - "backend/src/main/resources/db/migration/V1__baseline.sql"
      - "backend/src/main/resources/db/migration/V39__member_avatar.sql"
      - "backend/src/main/resources/db/migration/V40__group_space.sql"
      - "backend/src/main/resources/db/migration/V45__versioned_space_blueprints.sql"
      - "backend/src/main/resources/db/migration/V46__space_furniture_catalog.sql"
      - "backend/src/main/resources/db/migration/V47__space_blueprint_runtime.sql"
      - "backend/src/main/resources/db/migration/V48__space_furniture_interactions.sql"
      - "backend/src/main/resources/db/migration/V49__space_portable_item_catalog.sql"
      - ".github/scripts/realtime-deploy.test.cjs"
      - ".github/workflows/realtime-deploy.yml"
  push:
    branches: [develop]
    # Candidate freshness reads this list. Use quoted literal paths or a trailing /**.
    paths:
      - "realtime/Dockerfile"
      - "realtime/Dockerfile.dockerignore"
      - "realtime/build.gradle"
      - "realtime/settings.gradle"
      - "realtime/gradlew"
      - "realtime/gradle/**"
      - "realtime/src/main/**"
      - "infra/realtime/compose.yaml"
      - "infra/realtime/config.alloy"
      - "infra/realtime/check-candidate-revision.sh"
      - "infra/realtime/deploy-candidate.sh"
      - "infra/realtime/derive-token-key.mjs"
      - "infra/realtime/prepare-settings.sh"
      - "infra/realtime/select-candidate.sh"
      - ".github/workflows/realtime-deploy.yml"
  workflow_dispatch:
    inputs:
      resume_digest:
        description: "두 DB 준비 후 재개할 기존 후보의 sha256 digest. 비우면 새 이미지를 빌드합니다."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: realtime-${{ github.ref }}
  queue: max

env:
  REALTIME_REPOSITORY: ghcr.io/woowacourse-teams/jarihana-realtime
  REALTIME_HANDOFF_ROOT: /dev/shm/jarihana-realtime-${{ github.repository_id }}

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: 후보 digest 형식 확인
        if: github.event_name == 'workflow_dispatch' && inputs.resume_digest != ''
        env:
          RESUME_DIGEST: ${{ inputs.resume_digest }}
        run: |
          [[ "$RESUME_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo 'Invalid candidate digest.' >&2; exit 1; }
      - uses: actions/checkout@v4
        if: &verify_runtime github.event_name != 'workflow_dispatch' || inputs.resume_digest == ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: *verify_runtime
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        if: *verify_runtime
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle
          cache-dependency-path: realtime/**/*.gradle*
      - name: 후보 선택·배포 차단·복구 경로 검증
        if: *verify_runtime
        run: node --test .github/scripts/realtime-deploy.test.cjs
      - run: ./gradlew test bootJar --no-daemon
        if: *verify_runtime
        working-directory: realtime
      - name: 개발·운영 DB와 WebSocket 격리 검증
        if: *verify_runtime
        run: node infra/realtime/verify-protocol.mjs
      - name: Alloy 설정 검증
        if: *verify_runtime
        run: |
          docker run --rm -v "$PWD/infra/realtime/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.20.1 validate /etc/alloy/config.alloy

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' && inputs.resume_digest == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: GHCR 로그인
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<< "$GHCR_TOKEN"
      - uses: docker/setup-buildx-action@v4
      - name: ARM64 이미지 빌드 및 발행
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: realtime/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REALTIME_REPOSITORY }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  candidate:
    name: Select immutable realtime candidate
    needs: [verify, publish]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/develop' &&
      github.event_name != 'pull_request' && needs.verify.result == 'success' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.resume_digest != '' && needs.publish.result == 'skipped'))
    runs-on: [self-hosted, Linux, ARM64, jarihana-realtime]
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.select.outputs.digest }}
      revision: ${{ steps.select.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.digest }}
          RESUME_DIGEST: ${{ inputs.resume_digest }}
        run: bash infra/realtime/select-candidate.sh "$HOME/.local/state/jarihana-realtime"

  prepare:
    needs: candidate
    if: "!cancelled() && needs.candidate.result == 'success'"
    name: Prepare ${{ matrix.target }} realtime settings
    strategy:
      fail-fast: false
      matrix:
        target: [dev, prod]
    environment: ${{ matrix.target }}
    runs-on: [self-hosted, Linux, ARM64, jarihana-realtime]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 기존 API 설정 읽기
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RDS_URL: ${{ vars.RDS_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          bash infra/realtime/prepare-settings.sh

  deploy:
    needs: [candidate, prepare]
    if: always() && needs.candidate.result == 'success'
    runs-on: [self-hosted, Linux, ARM64, jarihana-realtime]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.result == 'success' && !cancelled()
        with:
          ref: ${{ needs.candidate.outputs.revision }}
          persist-credentials: false
      - name: 공용 realtime 배포 및 두 DB 상태 확인
        if: needs.prepare.result == 'success' && !cancelled()
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REALTIME_IMAGE: ${{ env.REALTIME_REPOSITORY }}@${{ needs.candidate.outputs.digest }}
          CANDIDATE_REVISION: ${{ needs.candidate.outputs.revision }}
          MONITORING_BIND_ADDRESS: ${{ vars.MONITORING_BIND_ADDRESS }}
        run: |
          bash infra/realtime/deploy-candidate.sh "$GITHUB_WORKSPACE/infra/realtime" "$HOME/.local/state/jarihana-realtime"
      - name: 이번 실행의 임시 설정 삭제
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -O "$REALTIME_HANDOFF_ROOT" && ! -L "$REALTIME_HANDOFF_ROOT" ]]; then
            rm -rf -- "$REALTIME_HANDOFF_ROOT/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
