services:
  postgres:
    image: postgres:17
    container_name: jarihana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarihana_local
      POSTGRES_USER: jarihana
      POSTGRES_PASSWORD: jarihana
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jarihana-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jarihana-postgres-data:
