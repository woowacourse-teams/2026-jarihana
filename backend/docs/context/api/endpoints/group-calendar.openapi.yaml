openapi: 3.0.3
info:
  title: Jarihana Group Calendar API
  version: "1.0"
  description: Group calendar read, event management, and recurring schedule history APIs.
servers:
  - url: /api
security:
  - AccessTokenCookie: []
paths:
  /groups/{groupId}/calendar:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroupCalendar
      summary: Read public calendar entries
      security: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Calendar entries, including public title and date/time only
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/CalendarResponse" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
  /groups/{groupId}/calendar/schedule-details:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getBaseScheduleDetails
      summary: Read member-only recurring or session schedule details
      description: Includes the location effective on that schedule date.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [RECURRING, SESSION] }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Schedule details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/ScheduleDetail" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrOccurrenceNotFound" }
  /groups/{groupId}/calendar/settings:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    put:
      operationId: updateGroupCalendarSettings
      summary: Toggle recurring and session schedule visibility
      description: Does not affect individual group events or group information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [showBaseSchedule]
              properties:
                showBaseSchedule: { type: boolean }
      responses:
        "200":
          description: Updated setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      showBaseSchedule: { type: boolean }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "409": { $ref: "#/components/responses/GroupEnded" }
  /groups/{groupId}/events:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: createGroupEvent
      summary: Create an individual group event
      description: The description is required. The event date range may span at most one year. A one-off regular meeting is allowed only for CLUB or STUDY on a date without a generated recurring occurrence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupEventInput" }
      responses:
        "201":
          description: Created event
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/GroupEvent" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "409": { $ref: "#/components/responses/GroupEnded" }
  /groups/{groupId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: eventId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getGroupEventDetails
      summary: Read member-only individual event details
      responses:
        "200":
          description: Event details, including description and location
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/GroupEvent" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrEventNotFound" }
    put:
      operationId: updateGroupEvent
      summary: Replace an individual event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GroupEventInput"
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/GroupEvent" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrEventNotFound" }
        "409": { $ref: "#/components/responses/GroupEndedOrConflict" }
    delete:
      operationId: deleteGroupEvent
      summary: Soft-delete an individual event
      parameters:
        - name: version
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Event deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrEventNotFound" }
        "409": { $ref: "#/components/responses/GroupEndedOrConflict" }
  /groups/{groupId}/recurring-schedule/series:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: registerRecurringSeries
      summary: Register the first recurring rule
      description: The first rule starts today. No apply scope is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecurringRuleInput" }
      responses:
        "201":
          description: Registered series and initial rule period
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/RecurringManageDetail" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "400": { $ref: "#/components/responses/InvalidParameterOrTypeMismatch" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupNotFound" }
        "409": { $ref: "#/components/responses/GroupEndedOrConflict" }
  /groups/{groupId}/recurring-schedule/manage:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getRecurringScheduleManagement
      summary: Read current recurring schedule management data
      responses:
        "200":
          description: Current series and latest rule period
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/RecurringManageDetail" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrRecurringRuleNotFound" }
  /groups/{groupId}/recurring-schedule/periods/{periodId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - name: periodId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getRecurringRulePeriod
      summary: Read a selected recurring rule period
      responses:
        "200":
          description: Selected rule period
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: "#/components/schemas/RecurringPeriodDetail" }
                  error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrRecurringRuleNotFound" }
    put:
      operationId: updateRecurringRulePeriod
      summary: Update weekdays and time for the selected rule period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RecurringRuleInput"
                - type: object
                  required: [version]
                  properties:
                    version: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated series version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionEnvelope" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrRecurringRuleNotFound" }
        "409": { $ref: "#/components/responses/GroupEndedOrConflict" }
  /groups/{groupId}/recurring-schedule/scoped:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    put:
      operationId: replaceRecurringRuleInScope
      summary: Replace recurring weekdays and time in a selected scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/RecurringRuleInput"
                - type: object
                  required: [applyScope, version]
                  properties:
                    applyScope: { $ref: "#/components/schemas/ApplyScope" }
                    version: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated series version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionEnvelope" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrRecurringRuleNotFound" }
        "409": { $ref: "#/components/responses/GroupEndedOrConflict" }
    delete:
      operationId: deleteRecurringRuleInScope
      summary: Remove recurring schedule in a selected scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [applyScope, version]
              properties:
                applyScope: { $ref: "#/components/schemas/ApplyScope" }
                version: { type: integer, format: int64 }
      responses:
        "204": { description: Recurring schedule removed in the selected scope }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrRecurringRuleNotFound" }
        "409": { $ref: "#/components/responses/GroupEndedOrConflict" }
  /groups/{groupId}/recurring-schedule/calendar-range:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    put:
      operationId: updateRecurringCalendarRange
      summary: Update the full recurring series date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate, version]
              properties:
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, nullable: true }
                version: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated series version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionEnvelope" }
        "400": { $ref: "#/components/responses/InvalidParameter" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/GroupOrRecurringRuleNotFound" }
        "409": { $ref: "#/components/responses/GroupEndedOrConflict" }
components:
  securitySchemes:
    AccessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken
  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    ApiError:
      type: object
      nullable: true
      properties:
        code: { type: string }
        message: { type: string }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { nullable: true }
        error: { $ref: "#/components/schemas/ApiError" }
    GroupEventInput:
      type: object
      required: [title, startDate, endDate, allDay, description]
      properties:
        eventType:
          type: string
          enum: [INDIVIDUAL, REGULAR_MEETING]
          default: INDIVIDUAL
          description: Omitted requests retain the existing individual-event behavior. REGULAR_MEETING is a single date with the fixed title '정기 모임'.
        status:
          type: string
          enum: [AUTO, UPCOMING, COMPLETED]
          default: AUTO
          description: For REGULAR_MEETING, AUTO derives status from the date; UPCOMING and COMPLETED are leader overrides.
        title: { type: string, minLength: 1, maxLength: 50 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: Inclusive end date; no more than one year after startDate. }
        allDay: { type: boolean }
        startTime: { type: string, format: time, nullable: true }
        endTime: { type: string, format: time, nullable: true }
        description: { type: string, minLength: 1, maxLength: 10000 }
        location: { type: string, maxLength: 255, nullable: true }
    GroupEvent:
      allOf:
        - $ref: "#/components/schemas/GroupEventInput"
        - type: object
          required: [id, eventType, status, effectiveStatus, version]
          properties:
            id: { type: integer, format: int64 }
            eventType: { type: string, enum: [INDIVIDUAL, REGULAR_MEETING] }
            status: { type: string, enum: [AUTO, UPCOMING, COMPLETED] }
            effectiveStatus: { type: string, enum: [UPCOMING, COMPLETED] }
            version: { type: integer, format: int64 }
    CalendarResponse:
      type: object
      required: [showBaseSchedule, flexibleAfterRecurring, events]
      properties:
        showBaseSchedule: { type: boolean }
        flexibleBeforeFirstRecurring:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/FlexibleBeforeFirstRecurring" }]
        flexibleAfterRecurring:
          type: array
          items: { $ref: "#/components/schemas/FlexibleAfterRecurring" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CalendarEvent" }
    FlexibleBeforeFirstRecurring:
      type: object
      properties:
        fromDate: { type: string, format: date }
        untilDate: { type: string, format: date }
        registeredOn: { type: string, format: date }
    FlexibleAfterRecurring:
      type: object
      properties:
        fromDate: { type: string, format: date }
        untilDate: { type: string, format: date, nullable: true }
    CalendarEvent:
      type: object
      required: [kind, title, startDate, endDate, allDay]
      properties:
        kind: { type: string, enum: [GROUP_EVENT, REGULAR_MEETING, RECURRING, SESSION] }
        id: { type: integer, format: int64, nullable: true }
        occurrenceKey: { type: string, nullable: true }
        periodId: { type: integer, format: int64, nullable: true }
        title: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        allDay: { type: boolean }
        startTime: { type: string, format: time, nullable: true }
        endTime: { type: string, format: time, nullable: true }
    ScheduleDetail:
      type: object
      properties:
        kind: { type: string, enum: [RECURRING, SESSION] }
        title: { type: string }
        date: { type: string, format: date }
        startTime: { type: string, format: time, nullable: true }
        endTime: { type: string, format: time, nullable: true }
        location: { type: string, nullable: true }
    RecurringRuleInput:
      type: object
      required: [daysOfWeek]
      properties:
        daysOfWeek:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startTime: { type: string, format: time, nullable: true }
        endTime: { type: string, format: time, nullable: true }
    ApplyScope:
      type: string
      enum: [ALL, PREVIOUS_RULE, FROM_TODAY]
    RecurringManageDetail:
      type: object
      required: [seriesId, periodId, startDate, version, daysOfWeek]
      properties:
        seriesId: { type: integer, format: int64 }
        periodId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        version: { type: integer, format: int64 }
        daysOfWeek:
          type: array
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startTime: { type: string, format: time, nullable: true }
        endTime: { type: string, format: time, nullable: true }
    RecurringPeriodDetail:
      type: object
      properties:
        periodId: { type: integer, format: int64 }
        effectiveFrom: { type: string, format: date }
        effectiveUntil: { type: string, format: date, nullable: true }
        version: { type: integer, format: int64 }
        daysOfWeek:
          type: array
          items: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
        startTime: { type: string, format: time, nullable: true }
        endTime: { type: string, format: time, nullable: true }
    VersionEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            version: { type: integer, format: int64 }
        error: { nullable: true, allOf: [{ $ref: "#/components/schemas/ApiError" }] }
  responses:
    InvalidParameter:
      description: Invalid range, date, time, or event input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidParameterOrTypeMismatch:
      description: Invalid rule or recurring schedule not supported for SESSION groups
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    AccessDenied:
      description: Group membership or leader permission required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GroupNotFound:
      description: Group not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GroupOrOccurrenceNotFound:
      description: Group or matching schedule occurrence not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GroupOrEventNotFound:
      description: Group or individual event not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GroupOrRecurringRuleNotFound:
      description: Group or recurring rule not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GroupEnded:
      description: The ended group cannot be changed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GroupEndedOrConflict:
      description: The group ended or the submitted version is stale
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
