spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  session:
    jdbc:
      initialize-schema: never

jarihana:
  group-space:
    weather:
      enabled: ${GROUP_SPACE_WEATHER_ENABLED:true}
  minigame:
    pepero-day:
      always-open: true
  auth:
    cookie:
      secure: false
