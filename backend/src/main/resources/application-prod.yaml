spring:
  main:
    banner-mode: "off"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  server:
    port: 8081
    address: 0.0.0.0
  endpoints:
    access:
      default: none
    web:
      base-path: /actuator
      discovery:
        enabled: false
      exposure:
        include: health,prometheus
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        database:
          include: db
    prometheus:
      access: read-only
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
    tags:
      application: ${spring.application.name}
      environment: prod

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: prod
