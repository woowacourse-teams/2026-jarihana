spring:
  application:
    name: jarihana
  jpa:
    open-in-view: false

jarihana:
  auth:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    refresh-cookie-name: refreshToken
    refresh-cookie-path: /api/auth
    refresh-token-validity: P14D
    cookie-secure: true
    jwt:
      secret: ${ACCESS_TOKEN_SECRET:}
      validity: PT1H
      cookie-name: accessToken
      cookie-path: /
  oauth:
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/oauth/github/callback}
      authorization-uri: https://github.com/login/oauth/authorize
      token-uri: https://github.com/login/oauth/access_token
      user-uri: https://api.github.com/user
