server:
  servlet:
    context-path: /api

chat:
  allowed-origins: ${CHAT_ALLOWED_ORIGINS:${FRONTEND_ORIGIN:http://localhost:5173}}
  listener:
    enabled: ${CHAT_LISTENER_ENABLED:true}
    reconnect-delay-ms: ${CHAT_LISTENER_RECONNECT_DELAY_MS:1000}
    application-name: ${CHAT_LISTENER_APPLICATION_NAME:jarihana-chat-listener}

spring:
  application:
    name: jarihana
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    jdbc:
      initialize-schema: never # 세션 테이블도 마이그레이션이 만든다
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

jdbc:
  hikari:
    enabled: false
  includes: QUERY
  opentelemetry:
    enabled: false

sentry:
  dsn: ${SENTRY_BACKEND_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${APP_VERSION:unknown}
  send-default-pii: false
  max-request-body-size: none
  enable-tracing: false

jarihana:
  invitation:
    token:
      active-key-id: ${INVITATION_TOKEN_ACTIVE_KEY_ID:primary}
      keys:
        primary: ${INVITATION_TOKEN_KEY_PRIMARY:}
        previous: ${INVITATION_TOKEN_KEY_PREVIOUS:}
  group-calendar:
    legacy-recurring-write-enabled: ${GROUP_CALENDAR_LEGACY_RECURRING_WRITE_ENABLED:false}
  push:
    enabled: ${PUSH_ENABLED:false}
    worker-enabled: ${PUSH_WORKER_ENABLED:true}
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${PUSH_VAPID_SUBJECT:}
    allowed-hosts: ${PUSH_ALLOWED_HOSTS:fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com}
    batch-size: ${PUSH_BATCH_SIZE:50}
    poll-delay: ${PUSH_POLL_DELAY:1000}
    lease-duration: ${PUSH_LEASE_DURATION:PT1M}
    request-timeout: ${PUSH_REQUEST_TIMEOUT:PT10S}
    connect-timeout: ${PUSH_CONNECT_TIMEOUT:PT5S}
    retry-delay: ${PUSH_RETRY_DELAY:PT5S}
    delivery:
      max-in-flight: ${PUSH_MAX_IN_FLIGHT:4}
      io-threads: ${PUSH_HTTP_IO_THREADS:1}
      dns-threads: ${PUSH_DNS_THREADS:2}
      dns-queue-capacity: ${PUSH_DNS_QUEUE_CAPACITY:4}
      max-connections-per-route: ${PUSH_HTTP_MAX_CONNECTIONS_PER_ROUTE:4}
      max-connections: ${PUSH_HTTP_MAX_CONNECTIONS:12}
      pool-wait-timeout: ${PUSH_HTTP_POOL_WAIT_TIMEOUT:PT1S}
      idle-timeout: ${PUSH_HTTP_IDLE_TIMEOUT:PT1M}
      connection-time-to-live: ${PUSH_HTTP_CONNECTION_TTL:PT5M}
      shutdown-timeout: ${PUSH_SHUTDOWN_TIMEOUT:PT15S}
  image:
    bucket: ${IMAGE_S3_BUCKET:techcourse-project-2026}
    region: ${IMAGE_S3_REGION:ap-northeast-2}
    key-prefix: ${IMAGE_S3_KEY_PREFIX:jarihana/images}
    public-base-url: ${IMAGE_S3_PUBLIC_BASE_URL:}
    delivery-base-url: ${IMAGE_CDN_DELIVERY_BASE_URL:}
    cloud-front-key-pair-id: ${IMAGE_CLOUDFRONT_KEY_PAIR_ID:}
    cloud-front-private-key: ${IMAGE_CLOUDFRONT_PRIVATE_KEY:}
    presigned-url-expiration: ${IMAGE_S3_PRESIGNED_URL_EXPIRATION:PT30M}
    access-url-expiration: ${IMAGE_ACCESS_URL_EXPIRATION:PT5M}
    max-file-size: ${IMAGE_MAX_FILE_SIZE:5242880}
    allowed-content-types: ${IMAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
    cleanup-enabled: ${IMAGE_CLEANUP_ENABLED:false}
    cleanup-grace-period: ${IMAGE_CLEANUP_GRACE_PERIOD:P7D}
    cleanup-lease: ${IMAGE_CLEANUP_LEASE:PT15M}
    cleanup-batch-size: ${IMAGE_CLEANUP_BATCH_SIZE:100}
    cleanup-interval-ms: ${IMAGE_CLEANUP_INTERVAL_MS:3600000}
  auth:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
    oauth-state-cookie-name: oauthState
    refresh-token-validity: P14D
    cookie:
      secure: true
      access-token-name: accessToken
      access-token-path: /
      refresh-token-name: refreshToken
      refresh-token-path: /api/auth
    jwt:
      secret: ${ACCESS_TOKEN_SECRET:}
      validity: PT1H
  oauth:
    github:
      client-id: ${GITHUB_OAUTH_CLIENT_ID:}
      client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
      redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/api/oauth/github/callback}
      token-uri: https://github.com/login/oauth/access_token
      user-uri: https://api.github.com/user

logging:
  structured:
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:unknown}
