server:
  servlet:
    context-path: /api

# Cached test contexts share a database but may inject different Clocks. Tests advance expiration
# explicitly through the command service; a background worker from another context must not race them.
gomoku:
  expiry:
    enabled: false

rhythm-battle:
  expiry:
    enabled: false

spring:
  datasource:
    # URL을 지정하지 않으면 WorkerPostgresProperties가 워커의 jarihana_test 연결을 제공한다.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    jdbc:
      initialize-schema: never
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false

jarihana:
  minigame:
    pepero-day:
      opens-at: 2026-08-19T00:00:00
      closes-at: 2026-08-20T10:00:00
      game-room-opens-at: 2026-08-20T13:00:00
      always-open: false
  image:
    public-base-url: https://service.example.test/api/images
    delivery-base-url: https://service.example.test/images
  auth:
    frontend-origin: http://localhost:5173
    oauth-state-cookie-name: oauthState
    refresh-token-validity: P14D
    refresh-token-reuse-grace: PT10S
    # 캐시된 테스트 컨텍스트가 DB를 함께 쓴다. 배경 정리가 다른 테스트가 넣은 만료 행을 지우지 않게 끄고,
    # 정리는 테스트가 RefreshTokenCleaner를 직접 불러 검증한다.
    refresh-token-cleanup:
      enabled: false
    # 운영과 같은 값으로 둔다. 테스트 서버는 HTTP로 요청을 받으므로, 쿠키가 요청의 isSecure()가 아니라
    # 이 설정을 따르는지 확인할 수 있다. 테스트 클라이언트는 쿠키를 직접 실어 보내므로 HTTP여도 영향이 없다.
    cookie:
      secure: true
      access-token-name: accessToken
      access-token-path: /
      refresh-token-name: refreshToken
      refresh-token-path: /api/auth
    jwt:
      secret: test-access-token-secret-key-for-hmac-sha256-0001
      validity: PT1H
  oauth:
    github:
      client-id: test-client-id
      client-secret: test-client-secret
      redirect-uri: http://localhost:8080/api/oauth/github/callback
      token-uri: https://github.com/login/oauth/access_token
      user-uri: https://api.github.com/user
