<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff"><title>토론해요 · 자리하나</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./composer.css"><link rel="stylesheet" href="./character-duel.css"><link rel="stylesheet" href="./history-conversation.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/examples/jsm/":"./vendor/addons/","cannon-es":"./vendor/cannon-es.js"}}</script>
<script type="module" src="./src/app.js"></script>
</head>
<body>
<main class="page">
<section class="arena" aria-label="자리하나 토론해요">
<svg class="transport-pipes" aria-hidden="true">
<g data-route="a"><path class="pipe-shadow"/><path class="pipe-rim"/><path class="pipe-body"/><path class="pipe-shade"/><path class="transport-route"/><path class="pipe-ring"/><path class="pipe-sheen"/><path class="pipe-flow"/></g>
<g data-route="b"><path class="pipe-shadow"/><path class="pipe-rim"/><path class="pipe-body"/><path class="pipe-shade"/><path class="transport-route"/><path class="pipe-ring"/><path class="pipe-sheen"/><path class="pipe-flow"/></g>
</svg>
<svg class="transport-pipes transport-joints" aria-hidden="true">
<g data-route="a"><path class="pipe-shadow"/><path class="pipe-rim"/><path class="pipe-body"/><path class="pipe-shade"/><path class="transport-route"/><path class="pipe-ring"/><path class="pipe-sheen"/></g>
<g data-route="b"><path class="pipe-shadow"/><path class="pipe-rim"/><path class="pipe-body"/><path class="pipe-shade"/><path class="transport-route"/><path class="pipe-ring"/><path class="pipe-sheen"/></g>
</svg>
<div class="stage">
<header class="topic" aria-labelledby="topic-title">
<h1 id="topic-title"></h1>
<div class="topic-meta"><p id="topic-description" class="intro"></p><p id="topic-deadline" hidden></p></div>
<p id="seat-instruction" role="status" aria-live="polite"></p>
</header>
<div id="scene" role="group" aria-label="투표 캡슐 통과 캐릭터가 나오는 미끄럼틀"></div>
<div class="vote-section" role="group" aria-label="내 편 고르기">
<div class="pipe-station a" id="station-a">
<button class="pipe-meter vote-option" data-side="a" type="button" aria-pressed="false"><strong id="percent-a">0%</strong><span id="count-a">0표</span></button>
<button class="vote-flag vote-option a" data-side="a" aria-pressed="false" type="button"><span class="claim-check" aria-hidden="true">✓</span><strong id="option-a"></strong><span class="seat-state">이쪽 선택</span></button>
</div>
<div class="pipe-station b" id="station-b">
<button class="pipe-meter vote-option" data-side="b" type="button" aria-pressed="false"><strong id="percent-b">0%</strong><span id="count-b">0표</span></button>
<button class="vote-flag vote-option b" data-side="b" aria-pressed="false" type="button"><span class="claim-check" aria-hidden="true">✓</span><strong id="option-b"></strong><span class="seat-state">이쪽 선택</span></button>
</div>
</div>
<span class="sr-only">새 캡슐이 들어오면서 통 속 색 비율이 투표 비율에 맞춰 서서히 바뀝니다</span>

<p id="empty-stage" hidden>아직 모인 이야기가 없어요.<br>먼저 한마디 건네보세요.</p>
</div>
<div class="composer-dock">
<form id="composer" class="composer">
<div class="composer-devices" role="group" aria-label="각 편의 의견 입력">
<div class="composer-device" data-composer-side="a">
<label id="composer-label" class="sr-only" for="message">왼쪽 편에 한마디</label>
<span class="inlet-mouth" aria-hidden="true"><b></b><i></i></span><button class="composer-avatar vote-option" data-side="a" type="button" aria-pressed="false" aria-expanded="false"><span class="composer-hint" aria-hidden="true">눌러서 한마디</span></button><div class="composer-drawer" inert><div class="drawer-clip"><div class="input-row"><div class="composer-field"><div id="reply-target" class="reply-target" hidden><div><strong id="reply-target-author">받아치기</strong><p id="reply-target-text"></p></div><button type="button" id="cancel-reply" class="quiet-button" aria-label="받아치기 취소">×</button></div><textarea id="message" data-input-side="a" rows="2" maxlength="160" placeholder="내 생각은…"></textarea><span class="char-count" id="char-count">0 / 160</span></div><button type="submit" id="send" data-send-side="a" disabled><span class="send-capsule" aria-hidden="true"><span class="capsule-paper"></span></span><span class="send-label" id="send-label">보내기</span></button></div></div></div>
</div>
<div class="composer-device" data-composer-side="b">
<label id="composer-label-b" class="sr-only" for="message-b">오른쪽 편에 한마디</label>
<span class="inlet-mouth" aria-hidden="true"><b></b><i></i></span><button class="composer-avatar vote-option" data-side="b" type="button" aria-pressed="false" aria-expanded="false"><span class="composer-hint" aria-hidden="true">눌러서 한마디</span></button><div class="composer-drawer" inert><div class="drawer-clip"><div class="input-row"><div class="composer-field"><textarea id="message-b" data-input-side="b" rows="2" maxlength="160" placeholder="내 생각은…"></textarea><span class="char-count" id="char-count-b">0 / 160</span></div><button type="submit" id="send-b" data-send-side="b" disabled><span class="send-capsule" aria-hidden="true"><span class="capsule-paper"></span></span><span class="send-label" id="send-label-b">보내기</span></button></div></div></div>
</div></div>
<p id="composer-note" role="status" hidden></p>
</form></div>
<div class="slide-controls"><div class="replay-control"><button id="flow-toggle" type="button" aria-pressed="false" aria-label="흐름 멈추기"><span class="flow-lever" aria-hidden="true"><i></i></span><span id="flow-action">멈추기</span></button><span id="flow-label">지난 대화 재생 중</span></div><span id="slide-status">지난 대화 리플레이</span><button id="spill" class="quiet-button">다음 대화 보기 →</button></div>
<div class="current-post" id="current-post"><div class="post-avatar" id="post-avatar"></div><div class="post-copy"><span id="post-meta"></span><p id="post-text"></p></div><div class="post-actions"><button class="quiet-button" id="reply-selected">받아치기 ↩</button><button class="quiet-button" id="replay-reply" hidden>받아치기 다시 보기</button></div></div>

</section>
<section class="history-section" aria-labelledby="history-title" hidden><div class="history-heading"><h2 id="history-title">모인 대화 <span id="total-count">0</span></h2><div class="history-tabs" role="group" aria-label="대화 보기"><button data-filter="all" aria-pressed="true">전체</button><button data-filter="mine" aria-pressed="false">내 대화</button></div></div><p class="history-help">마음에 걸리는 한마디를 눌러 받아쳐 보세요.</p><div id="history-list"></div><button id="more-history" class="quiet-button" hidden>이전 대화 더 보기</button></section>
<p id="stage-status" class="sr-only" aria-live="polite"></p>
<footer><p id="storage-note">서버에 연결하고 있어요.</p></footer>
</main></body></html>
