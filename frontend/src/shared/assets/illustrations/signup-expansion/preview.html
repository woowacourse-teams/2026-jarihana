<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>자리하나 가입 이미지</title>
    <style>
      :root { color-scheme: light; font-family: "Malgun Gothic", sans-serif; color: #1d1d1f; background: #f4f5f7; }
      * { box-sizing: border-box; }
      body { max-width: 1200px; margin: 0 auto; padding: 36px 24px 48px; }
      header { margin-bottom: 28px; }
      h1 { margin: 8px 0; font-size: clamp(24px, 4vw, 34px); }
      h2 { font-size: 20px; margin: 28px 0 16px; }
      p { color: #666; font-size: 14px; line-height: 1.7; margin: 8px 0; }
      .brand { color: #08736f; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      .scenes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      figure { margin: 0; min-width: 0; background: white; border: 1px solid #e0e0e0; border-radius: 20px; overflow: hidden; }
      .art { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; padding: 16px; }
      .art img { width: 100%; height: 100%; object-fit: contain; }
      .transparent { background: conic-gradient(#fff 25%, #f0f2f2 0 50%, #fff 0 75%, #f0f2f2 0) 0 0 / 20px 20px; }
      .mint { background: #dff8f3; }
      .scenes .art { aspect-ratio: 1.25; padding: 24px; }
      figcaption { border-top: 1px solid #eee; padding: 16px; }
      strong { display: block; font-size: 16px; margin-bottom: 6px; }
      small { color: #666; font-size: 12px; line-height: 1.6; display: block; }
      .icons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      .icon { display: flex; align-items: center; gap: 12px; background: white; border: 1px solid #e0e0e0; padding: 18px; border-radius: 14px; font-size: 13px; }
      .icon img { width: 28px; height: 28px; }
      .sizes { display: flex; align-items: center; gap: 8px; margin-left: auto; }
      .sizes img:first-child { width: 16px; height: 16px; }
      .sizes img:last-child { width: 20px; height: 20px; }
      footer { border-top: 1px solid #ddd; margin-top: 32px; padding-top: 16px; }
      code { font-size: 12px; overflow-wrap: anywhere; }
      @media (max-width: 760px) { .grid, .icons { grid-template-columns: repeat(2, minmax(0, 1fr)); } .sizes { display: none; } }
      @media (max-width: 420px) { body { padding: 24px 16px; } .scenes { grid-template-columns: 1fr; } .art { padding: 8px; } figcaption { padding: 12px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">JARIHANA / SIGNUP ASSETS</div>
      <h1>어떤 시작에도, 자리 하나</h1>
      <p>기존 크루와 코치에 이어지는 가입 이미지입니다. 체크무늬는 투명 영역을 확인하기 위한 미리보기 배경입니다.</p>
    </header>
    <h2>가입 유형</h2>
    <div class="grid">
      <figure><div class="art"><img src="../signup-crew.png" alt="백팩과 책을 든 기존 크루 캐릭터"></div><figcaption><strong>우테코 크루</strong><small>기존 이미지, 스타일 비교용</small></figcaption></figure>
      <figure><div class="art"><img src="../signup-coach.png" alt="사원증과 노트북을 든 기존 코치 캐릭터"></div><figcaption><strong>우테코 코치</strong><small>기존 이미지, 스타일 비교용</small></figcaption></figure>
      <figure><div class="art transparent"><img src="signup-bootcamp.png" alt="민트색 후드와 태블릿의 부트캠프 캐릭터"></div><figcaption><strong>부트캠프</strong><small>후드, 헤드폰, 태블릿과 펜</small><code>signup-bootcamp.png</code></figcaption></figure>
      <figure><div class="art transparent"><img src="signup-company.png" alt="셔츠와 텀블러의 현직자 캐릭터"></div><figcaption><strong>회사</strong><small>하늘색 셔츠, 편안한 바지와 텀블러</small><code>signup-company.png</code></figcaption></figure>
    </div>
    <h2>선택 카드와 가입 완료</h2>
    <div class="grid scenes">
      <figure><div class="art transparent"><img src="signup-others.png" alt="코치, 부트캠프 수강생과 현직자가 함께한 묶음 그림"></div><figcaption><strong>시안 A의 그 외 카드</strong><small>세 소속을 한눈에 보여주는 독립된 묶음 그림</small><code>signup-others.png</code></figcaption></figure>
      <figure><div class="art mint"><img src="signup-complete.png" alt="민트색 의자와 체크 토큰으로 표현한 가입 완료"></div><figcaption><strong>가입 완료</strong><small>회원에게 준비된 자리와 작은 축하</small><code>signup-complete.png</code></figcaption></figure>
    </div>
    <h2>소속 아이콘 4종</h2>
    <div class="icons">
      <div class="icon"><img src="icons/affiliation-crew.svg" alt=""><span>크루</span><span class="sizes"><img src="icons/affiliation-crew.svg" alt=""><img src="icons/affiliation-crew.svg" alt=""></span></div>
      <div class="icon"><img src="icons/affiliation-coach.svg" alt=""><span>코치</span><span class="sizes"><img src="icons/affiliation-coach.svg" alt=""><img src="icons/affiliation-coach.svg" alt=""></span></div>
      <div class="icon"><img src="icons/affiliation-bootcamp.svg" alt=""><span>부트캠프</span><span class="sizes"><img src="icons/affiliation-bootcamp.svg" alt=""><img src="icons/affiliation-bootcamp.svg" alt=""></span></div>
      <div class="icon"><img src="icons/affiliation-company.svg" alt=""><span>회사</span><span class="sizes"><img src="icons/affiliation-company.svg" alt=""><img src="icons/affiliation-company.svg" alt=""></span></div>
    </div>
    <footer><p>PNG는 투명 배경 원본입니다. SVG는 24 x 24 viewBox, 1.75 선 두께와 currentColor를 사용합니다. 제작 프롬프트는 prompts.json에 있습니다.</p></footer>
  </body>
</html>
