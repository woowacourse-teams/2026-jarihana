global:
  scrape_interval: 60s
  scrape_timeout: 10s

scrape_configs:
  - job_name: jarihana-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [127.0.0.1:8081]
    sample_limit: 2000
    metric_relabel_configs:
      - source_labels: [status]
        target_label: status_class
        regex: '([1-5])[0-9][0-9]'
        replacement: '${1}xx'
      - source_labels: [__name__, uri]
        action: drop
        regex: 'http_server_requests_seconds_(count|sum);(/api)?/actuator(/.*)?'
      - source_labels: [__name__, area]
        action: drop
        regex: 'jvm_memory_used_bytes;nonheap'
      - source_labels: [__name__]
        action: keep
        regex: 'http_server_requests_seconds_(count|sum)|jvm_memory_used_bytes|jvm_threads_live_threads|jvm_gc_overhead|hikaricp_connections_(active|pending)'
