services:
  backend:
    image: "${BACKEND_IMAGE:?}@${BACKEND_DIGEST:?}"
    container_name: "${DEPLOY_CONTAINER:?}"
    restart: "no"
    mem_limit: 896m
    stop_grace_period: 120s
    ports:
      - "${APP_BIND_ADDRESS:?}:${APP_PORT:?}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:?}:8081"
    environment:
      DB_URL: "jdbc:postgresql://${RDS_URL:?}:5432/${DEPLOY_DB_NAME:?}?sslmode=require"
      DB_USERNAME: "${DB_USERNAME:?}"
      DB_PASSWORD: "${DB_PASSWORD:?}"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      INVITATION_TOKEN_ACTIVE_KEY_ID: "${INVITATION_TOKEN_ACTIVE_KEY_ID:-primary}"
      INVITATION_TOKEN_KEY_PRIMARY: "${INVITATION_TOKEN_KEY_PRIMARY:?}"
      INVITATION_TOKEN_KEY_PREVIOUS: "${INVITATION_TOKEN_KEY_PREVIOUS:-}"
      ACCESS_TOKEN_SECRET: "${ACCESS_TOKEN_SECRET:?}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:?}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:?}"
      GITHUB_OAUTH_REDIRECT_URI: "${GITHUB_OAUTH_REDIRECT_URI:?}"
      PUSH_ENABLED: "${PUSH_ENABLED:-false}"
      PUSH_WORKER_ENABLED: "${PUSH_WORKER_ENABLED:-true}"
      PUSH_VAPID_PUBLIC_KEY: "${PUSH_VAPID_PUBLIC_KEY:-}"
      PUSH_VAPID_PRIVATE_KEY: "${PUSH_VAPID_PRIVATE_KEY:-}"
      PUSH_VAPID_SUBJECT: "${PUSH_VAPID_SUBJECT:-}"
      SENTRY_BACKEND_DSN: "${SENTRY_BACKEND_DSN:-}"
      IMAGE_S3_BUCKET: "${IMAGE_S3_BUCKET:?}"
      IMAGE_S3_REGION: "${IMAGE_S3_REGION:?}"
      IMAGE_S3_KEY_PREFIX: "${IMAGE_S3_KEY_PREFIX:?}"
      IMAGE_S3_PUBLIC_BASE_URL: "${IMAGE_S3_PUBLIC_BASE_URL:?}"
      IMAGE_CDN_DELIVERY_BASE_URL: "${IMAGE_CDN_DELIVERY_BASE_URL:?}"
      IMAGE_CLOUDFRONT_KEY_PAIR_ID: "${IMAGE_CLOUDFRONT_KEY_PAIR_ID:?}"
      IMAGE_CLOUDFRONT_PRIVATE_KEY: "${IMAGE_CLOUDFRONT_PRIVATE_KEY:?}"
      SPRING_PROFILES_ACTIVE: "${DEPLOY_ENVIRONMENT:?}"
      APP_VERSION: "${BACKEND_DIGEST:?}"
      WORKER_CONTROL_TOKEN: "${WORKER_CONTROL_TOKEN:?}"
      PUSH_WORKER_CONTROL_ENABLED: "true"
      PUSH_WORKER_START_PAUSED: "true"
      PUSH_WORKER_HOST_ID: "${DEPLOY_HOST_ID:?}"
      PUSH_WORKER_ENVIRONMENT: "${DEPLOY_ENVIRONMENT:?}"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 90s
      JDK_JAVA_OPTIONS: -Xms128m -Xmx384m
      OTEL_SDK_DISABLED: "true"
    labels:
      com.jarihana.monitoring.logs: "true"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
