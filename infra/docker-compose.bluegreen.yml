# Linux host deployment; requires Compose >= 2.24.4 (!override).
name: jarihana-prod
services:
  backend-blue:
    extends:
      file: docker-compose.yml
      service: backend
    container_name: jarihana-backend-blue
    image: ghcr.io/woowacourse-teams/jarihana-backend:${BLUE_TAG:?BLUE_TAG is required}
    environment:
      APP_VERSION: ${BLUE_TAG}
    ports: !override
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    stop_grace_period: 45s
  backend-green:
    extends:
      file: docker-compose.yml
      service: backend
    container_name: jarihana-backend-green
    image: ghcr.io/woowacourse-teams/jarihana-backend:${GREEN_TAG:?GREEN_TAG is required}
    environment:
      APP_VERSION: ${GREEN_TAG}
    ports: !override
      - "127.0.0.1:28080:8080"
      - "127.0.0.1:28081:8081"
    stop_grace_period: 45s
  proxy:
    image: nginx:1.30.5-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${BLUEGREEN_STATE_DIR:?BLUEGREEN_STATE_DIR is required}/proxy:/etc/nginx:ro
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
  alloy:
    extends:
      file: docker-compose.yml
      service: alloy
    environment:
      APP_METRICS_TARGET: 127.0.0.1:18081
    volumes:
      - ./monitoring/alloy/bluegreen.alloy:/etc/alloy/bluegreen.alloy:ro
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy
volumes:
  alloy-data:
