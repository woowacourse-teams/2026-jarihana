name: jarihana-prod

services:
  backend:
    image: "ghcr.io/woowacourse-teams/jarihana-backend:${BACKEND_TAG:?BACKEND_TAG is required}"
    container_name: jarihana-backend

    environment:
      SPRING_PROFILES_ACTIVE: prod
      FLYWAY_BASELINE_ON_MIGRATE: "${FLYWAY_BASELINE_ON_MIGRATE:-false}"
      INVITATION_TOKEN_ACTIVE_KEY_ID: "${INVITATION_TOKEN_ACTIVE_KEY_ID:-primary}"
      INVITATION_TOKEN_KEY_PRIMARY: "${INVITATION_TOKEN_KEY_PRIMARY:-}"
      INVITATION_TOKEN_KEY_PREVIOUS: "${INVITATION_TOKEN_KEY_PREVIOUS:-}"
      PUSH_ENABLED: "${PUSH_ENABLED:-false}"
      PUSH_WORKER_ENABLED: "${PUSH_WORKER_ENABLED:-true}"
      PUSH_VAPID_PUBLIC_KEY: "${PUSH_VAPID_PUBLIC_KEY:-}"
      PUSH_VAPID_PRIVATE_KEY: "${PUSH_VAPID_PRIVATE_KEY:-}"
      PUSH_VAPID_SUBJECT: "${PUSH_VAPID_SUBJECT:-}"
      APP_VERSION: "${BACKEND_TAG:?BACKEND_TAG is required}"
      OTEL_SDK_DISABLED: "true"
      SENTRY_BACKEND_DSN: "${SENTRY_BACKEND_DSN:-}"
      SENTRY_ENVIRONMENT: production
      DB_URL: "jdbc:postgresql://${RDS_URL:?RDS_URL is required}:5432/jarihana_prod?sslmode=require"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      ACCESS_TOKEN_SECRET: "${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}"
      GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID:?GITHUB_OAUTH_CLIENT_ID is required}"
      GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET:?GITHUB_OAUTH_CLIENT_SECRET is required}"
      GITHUB_OAUTH_REDIRECT_URI: "${GITHUB_OAUTH_REDIRECT_URI:?GITHUB_OAUTH_REDIRECT_URI is required}"
      IMAGE_S3_BUCKET: "${IMAGE_S3_BUCKET:?IMAGE_S3_BUCKET is required}"
      IMAGE_S3_REGION: "${IMAGE_S3_REGION:?IMAGE_S3_REGION is required}"
      IMAGE_S3_KEY_PREFIX: "${IMAGE_S3_KEY_PREFIX:?IMAGE_S3_KEY_PREFIX is required}"
      IMAGE_S3_PUBLIC_BASE_URL: "${IMAGE_S3_PUBLIC_BASE_URL:?IMAGE_S3_PUBLIC_BASE_URL is required}"
      IMAGE_CDN_DELIVERY_BASE_URL: "${IMAGE_CDN_DELIVERY_BASE_URL:?IMAGE_CDN_DELIVERY_BASE_URL is required}"
      IMAGE_CLOUDFRONT_KEY_PAIR_ID: "${IMAGE_CLOUDFRONT_KEY_PAIR_ID:?IMAGE_CLOUDFRONT_KEY_PAIR_ID is required}"
      IMAGE_CLOUDFRONT_PRIVATE_KEY: "${IMAGE_CLOUDFRONT_PRIVATE_KEY:?IMAGE_CLOUDFRONT_PRIVATE_KEY is required}"
      IMAGE_CLEANUP_ENABLED: "${IMAGE_CLEANUP_ENABLED:-false}"
      IMAGE_CLEANUP_GRACE_PERIOD: "${IMAGE_CLEANUP_GRACE_PERIOD:-P7D}"
      IMAGE_CLEANUP_LEASE: "${IMAGE_CLEANUP_LEASE:-PT15M}"
      IMAGE_CLEANUP_BATCH_SIZE: "${IMAGE_CLEANUP_BATCH_SIZE:-100}"
      IMAGE_CLEANUP_INTERVAL_MS: "${IMAGE_CLEANUP_INTERVAL_MS:-3600000}"

    labels:
      com.jarihana.monitoring.logs: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"

    depends_on:
      alloy:
        condition: service_started
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      HOST_ID: ${HOST_ID:?set HOST_ID to a stable app-host identifier}
      PROMETHEUS_REMOTE_WRITE_URL: ${PROMETHEUS_REMOTE_WRITE_URL:?set Prometheus remote_write URL}
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?set Loki push URL}
      APP_METRICS_TARGET: 127.0.0.1:8081
      POSTGRES_MONITOR_DSN: ${POSTGRES_MONITOR_DSN:?set PostgreSQL monitoring DSN}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./monitoring/alloy/postgres-queries.yaml:/etc/alloy/postgres-queries.yaml:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  alloy-data:
