name: infra

services:
  postgres:
    image: postgres:17
    container_name: jarihana-db-postgres

    environment:
      POSTGRES_DB: jarihana
      POSTGRES_USER: jarihana
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarihana -d jarihana"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres-data:
    name: infra_postgres-data

networks:
  default:
    name: infra_default
