apiVersion: 1

policies:
  - orgId: 1
    receiver: jarihana-slack
    group_by:
      - grafana_folder
      - alertname
      - environment
      - host_id
      - mountpoint
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: jarihana-slack
        object_matchers:
          - [severity, "=", critical]
        group_wait: 0s
