      description: 메모리는 MemAvailable 기준이며 회수 가능한 캐시는 여유 용량에 포함합니다. 사용률이 90% 이상이면 추가 지속 시간을 기다리지 않고 알립니다. 앱·모니터링 EC2 각각의 호스트 전체 기준이며 컨테이너·JVM·RDS 사용률이 아닙니다.
