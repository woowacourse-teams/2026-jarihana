---
apiVersion: 1
deleteRules:
- orgId: 1
  uid: jarihana-dev-backend
- orgId: 1
  uid: jarihana-dev-metrics
- orgId: 1
  uid: jarihana-prod-backend
- orgId: 1
  uid: jarihana-prod-metrics
groups:
- orgId: 1
  name: jarihana-availability
  folder: Jarihana
  interval: 10s
  rules:
  - uid: jarihana-host-disk-warning
    title: "[EC2] 디스크 사용률 주의"
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      severity: warning
    annotations:
      summary: "{{ $labels.host_id }} {{ $labels.mountpoint }} 디스크 사용률 80% 이상이 5분 지속"
      display_name: 디스크 사용률 높음
      value_label: 디스크 사용률
      value_kind: percent
      firing_condition: 80% 이상 90% 미만이 5분 지속
      resolved_condition: 80% 미만 또는 90% 이상 (90% 이상이면 긴급 알림 대상)
      action: 해당 마운트의 로그·Docker 데이터·모니터링 저장 공간을 확인하세요.
      description: 일반 프로세스가 쓸 수 있는 avail 용량 기준입니다. 해당 마운트의 로그·Docker 데이터·Prometheus/Loki 저장량을 확인하세요. 80% 이상 90% 미만이 5분 지속될 때 알립니다.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: (100 * (1 - node_filesystem_avail_bytes{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} / node_filesystem_size_bytes{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"})) and (node_filesystem_size_bytes{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} > 0) and (node_filesystem_readonly{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} == 0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A >= 80 && $A < 90"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-host-disk-critical
    title: "[EC2] 디스크 사용률 긴급"
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      severity: critical
    annotations:
      summary: "{{ $labels.host_id }} {{ $labels.mountpoint }} 디스크 사용률 90% 이상"
      display_name: 디스크 사용률 높음
      value_label: 디스크 사용률
      value_kind: percent
      firing_condition: 90% 이상 (추가 지속 시간 없이 평가)
      resolved_condition: 90% 미만 (80% 이상이 5분 지속되면 주의 알림 대상)
      action: 해당 마운트의 로그·Docker 데이터·모니터링 저장 공간을 확인하세요.
      description: 일반 프로세스가 쓸 수 있는 avail 용량 기준입니다. 해당 마운트의 로그·Docker 데이터·Prometheus/Loki 저장량을 확인하세요. 90% 이상이면 추가 지속 시간을 기다리지 않고 알립니다.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: (100 * (1 - node_filesystem_avail_bytes{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} / node_filesystem_size_bytes{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"})) and (node_filesystem_size_bytes{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} > 0) and (node_filesystem_readonly{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} == 0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A >= 90"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-host-inode-warning
    title: "[EC2] inode 사용률 주의"
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      severity: warning
    annotations:
      summary: "{{ $labels.host_id }} {{ $labels.mountpoint }} inode 사용률 80% 이상이 5분 지속"
      display_name: 파일 생성 여유 부족 (inode)
      value_label: inode 사용률
      value_kind: percent
      firing_condition: 80% 이상 90% 미만이 5분 지속
      resolved_condition: 80% 미만 또는 90% 이상 (90% 이상이면 긴급 알림 대상)
      action: 해당 마운트에 작은 파일이 많이 쌓였는지 확인하세요.
      description: 파일 개수를 관리하는 inode의 사용률입니다. 용량이 남아 있어도 inode가 부족하면 파일을 만들 수 없습니다. 해당 마운트의 작은 파일 누적을 확인하세요. 80% 이상 90% 미만이 5분 지속될 때 알립니다.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: (100 * (1 - node_filesystem_files_free{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} / node_filesystem_files{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"})) and (node_filesystem_files{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} > 0) and (node_filesystem_readonly{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} == 0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A >= 80 && $A < 90"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-host-inode-critical
    title: "[EC2] inode 사용률 긴급"
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      severity: critical
    annotations:
      summary: "{{ $labels.host_id }} {{ $labels.mountpoint }} inode 사용률 90% 이상"
      display_name: 파일 생성 여유 부족 (inode)
      value_label: inode 사용률
      value_kind: percent
      firing_condition: 90% 이상 (추가 지속 시간 없이 평가)
      resolved_condition: 90% 미만 (80% 이상이 5분 지속되면 주의 알림 대상)
      action: 해당 마운트에 작은 파일이 많이 쌓였는지 확인하세요.
      description: 파일 개수를 관리하는 inode의 사용률입니다. 용량이 남아 있어도 inode가 부족하면 파일을 만들 수 없습니다. 해당 마운트의 작은 파일 누적을 확인하세요. 90% 이상이면 추가 지속 시간을 기다리지 않고 알립니다.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: (100 * (1 - node_filesystem_files_free{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} / node_filesystem_files{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"})) and (node_filesystem_files{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} > 0) and (node_filesystem_readonly{job="jarihana-host",fstype=~"ext2|ext3|ext4|xfs|btrfs"} == 0)
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A >= 90"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-dev-health
    title: "[dev] 백엔드 헬스체크 실패"
    condition: B
    for: 0s
    noDataState: Alerting
    execErrState: Error
    labels:
      service_name: jarihana
      environment: dev
      severity: critical
    annotations:
      summary: dev 백엔드의 정상 상태를 확인하지 못했습니다.
      display_name: 백엔드 헬스체크
      value_kind: health
      firing_condition: /actuator/health 정상 응답 실패 또는 150초간 결과 미수신
      resolved_condition: 최근 150초 이내의 헬스체크 결과가 모두 정상 (HTTP 200·UP)
      action: 백엔드 로그·RDS 연결·Alloy 수집 및 전송 상태를 확인하세요.
      description: 10초마다 /actuator/health를 확인합니다. HTTP 200과 UP 응답을 받지 못했거나, 최근 150초 동안 헬스체크 결과가 도착하지 않았습니다. 앱·RDS 연결·Alloy·EC2 및 전송 경로를 확인하세요.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 1 - (min(probe_success{job="jarihana-health",environment="dev"} and (time() - timestamp(probe_success{job="jarihana-health",environment="dev"}) < 150)) or vector(0))
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A > 0"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-dev-http500
    title: "[dev] HTTP 500 오류"
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      environment: dev
      severity: critical
    annotations:
      summary: dev 백엔드에서 HTTP 500 오류가 발생했습니다.
      display_name: HTTP 500 오류
      value_label: 최근 5분 HTTP 500 오류
      value_kind: count
      firing_condition: 최근 5분 동안 HTTP 500 요청 완료 로그가 1건 이상
      resolved_condition: 최근 5분 동안 해당 로그가 0건 (로그 수집 중단 여부도 확인 필요)
      action: Loki에서 해당 환경의 오류 로그와 요청 ID를 확인하세요.
      description: 최근 5분 동안 HTTP 500 요청 완료 로그가 한 건 이상 수집됐습니다. Loki에서 같은 환경의 http.request.completed 로그와 request ID를 확인하세요. 알림 해제는 최근 5분에 해당 로그가 없다는 뜻입니다.
    data:
    - refId: A
      datasourceUid: loki
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: sum(count_over_time({service_name="jarihana",environment="dev"} | json | log_logger="com.project.jarihana.common.logging.Events" | event_action="http.request.completed" | http_response_status_code=500 | __error__="" [5m])) or vector(0)
        refId: A
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A > 0"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-prod-health
    title: "[prod] 백엔드 헬스체크 실패"
    condition: B
    for: 0s
    noDataState: Alerting
    execErrState: Error
    labels:
      service_name: jarihana
      environment: prod
      severity: critical
    annotations:
      summary: prod 활성 경로의 백엔드 정상 상태 또는 라우팅 정보를 확인하지 못했습니다.
      display_name: 백엔드 헬스체크
      value_kind: health
      firing_condition: 활성 경로의 /actuator/health 실패·150초간 결과 미수신 또는 라우팅 정보 확인 실패
      resolved_condition: 최신 Nginx 라우팅 정보가 유효하고 활성 경로의 최근 헬스체크가 정상 (HTTP 200·UP)
      action: 활성 백엔드 로그·RDS 연결·앱 Alloy와 중앙 배포 수집기의 Nginx 라우팅 수집 상태를 확인하세요.
      description: 중앙 배포 수집기의 Nginx 활성 경로와 해당 호스트의 /actuator/health를 확인합니다. 활성 호스트의 HTTP 200·UP 결과가 없거나 150초보다 오래됐거나, 라우팅 수집이 실패하거나 45초보다 오래되면 알립니다. 앱·RDS·Alloy·중앙 수집기 및 전송 경로를 확인하세요.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 1 - (((count((min by(environment,host_id) (probe_success{job="jarihana-health",environment="prod"} and (time() - timestamp(probe_success{job="jarihana-health",environment="prod"}) < 150)) == 1) and on(environment,host_id) (max by(environment,host_id) (jarihana_nginx_route{environment="prod"} == 1 and (time() - timestamp(jarihana_nginx_route{environment="prod"}) < 45) and on(environment,instance,job) (time() - jarihana_deployment_collector_timestamp_seconds{environment="prod"} < 45) and on(environment,instance,job) (time() - timestamp(jarihana_deployment_collector_timestamp_seconds{environment="prod"}) < 45) and on(environment,instance,job) (jarihana_deployment_source_success{environment="prod",source="nginx"} == 1) and on(environment,instance,job) (time() - timestamp(jarihana_deployment_source_success{environment="prod",source="nginx"}) < 45) and on(environment,instance,job) (time() - jarihana_deployment_source_observed_timestamp_seconds{environment="prod",source="nginx"} < 45) and on(environment,instance,job) (time() - timestamp(jarihana_deployment_source_observed_timestamp_seconds{environment="prod",source="nginx"}) < 45)))) == 1) == bool count(max by(environment,host_id) (jarihana_nginx_route{environment="prod"} == 1 and (time() - timestamp(jarihana_nginx_route{environment="prod"}) < 45) and on(environment,instance,job) (time() - jarihana_deployment_collector_timestamp_seconds{environment="prod"} < 45) and on(environment,instance,job) (time() - timestamp(jarihana_deployment_collector_timestamp_seconds{environment="prod"}) < 45) and on(environment,instance,job) (jarihana_deployment_source_success{environment="prod",source="nginx"} == 1) and on(environment,instance,job) (time() - timestamp(jarihana_deployment_source_success{environment="prod",source="nginx"}) < 45) and on(environment,instance,job) (time() - jarihana_deployment_source_observed_timestamp_seconds{environment="prod",source="nginx"} < 45) and on(environment,instance,job) (time() - timestamp(jarihana_deployment_source_observed_timestamp_seconds{environment="prod",source="nginx"}) < 45)))) or vector(0))
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A > 0"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-prod-http500
    title: "[prod] HTTP 500 오류"
    condition: B
