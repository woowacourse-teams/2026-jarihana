      description: CPU는 가장 최근 두 수집 사이의 사용률입니다. 사용률이 90% 이상이면 추가 지속 시간을 기다리지 않고 알립니다. 앱·모니터링 EC2 각각의 호스트 전체 기준이며 컨테이너·JVM·RDS 사용률이 아닙니다.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 100 * (1 - avg by (host_id) (irate(node_cpu_seconds_total{job="jarihana-host",mode="idle"}[2m])))
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A >= 90"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-host-memory-warning
    title: "[EC2] 메모리 사용률 주의"
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      severity: warning
    annotations:
      summary: "{{ $labels.host_id }} EC2 메모리 사용률 80% 이상이 5분 지속"
      description: 메모리는 MemAvailable 기준이며 회수 가능한 캐시는 여유 용량에 포함합니다. 80% 이상 90% 미만이 5분 지속될 때 알립니다. 앱·모니터링 EC2 각각의 호스트 전체 기준이며 컨테이너·JVM·RDS 사용률이 아닙니다.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="jarihana-host"} / node_memory_MemTotal_bytes{job="jarihana-host"})
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A >= 80 && $A < 90"
        refId: B
        type: math
    isPaused: false
