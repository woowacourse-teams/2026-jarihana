        expr: sum(count_over_time({service_name="jarihana",environment="prod"} | json | log_logger="com.project.jarihana.common.logging.Events" | event_action="http.request.completed" | http_response_status_code=500 | __error__="" [5m])) or vector(0)
        refId: A
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
