      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="jarihana-host"} / node_memory_MemTotal_bytes{job="jarihana-host"})
        refId: A
        instant: true
        range: false
    - refId: B
