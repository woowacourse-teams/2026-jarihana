      action: EC2 전체 메모리 기준입니다. 메모리를 많이 사용하는 프로세스를 확인하세요.
      description: 메모리는 MemAvailable 기준이며 회수 가능한 캐시는 여유 용량에 포함합니다. 80% 이상 90% 미만이 5분 지속될 때 알립니다. 앱·모니터링 EC2 각각의 호스트 전체 기준이며 컨테이너·JVM·RDS 사용률이 아닙니다.
    data:
