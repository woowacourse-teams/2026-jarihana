        editorMode: code
        expr: 1 - (min(probe_success{job="jarihana-health",environment="prod"} and (time() - timestamp(probe_success{job="jarihana-health",environment="prod"}) < 150)) or vector(0))
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A > 0"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-prod-http500
    title: "[prod] HTTP 500 오류"
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      environment: prod
      severity: critical
    annotations:
      summary: prod 백엔드에서 HTTP 500 오류가 발생했습니다.
      description: 최근 5분 동안 HTTP 500 요청 완료 로그가 한 건 이상 수집됐습니다. Loki에서 같은 환경의 http.request.completed 로그와 request ID를 확인하세요. 알림 해제는 최근 5분에 해당 로그가 없다는 뜻입니다.
    data:
    - refId: A
      datasourceUid: loki
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: loki
          uid: loki
        editorMode: code
        expr: sum(count_over_time({service_name="jarihana",environment="prod"} | json | log_logger="com.project.jarihana.common.logging.Events" | event_action="http.request.completed" | http_response_status_code=500 | __error__="" [5m])) or vector(0)
        refId: A
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A > 0"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-host-cpu-warning
    title: "[EC2] CPU 사용률 주의"
    condition: B
    for: 5m
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      severity: warning
    annotations:
      summary: "{{ $labels.host_id }} EC2 CPU 사용률 80% 이상이 5분 지속"
      description: CPU는 가장 최근 두 수집 사이의 사용률입니다. 80% 이상 90% 미만이 5분 지속될 때 알립니다. 앱·모니터링 EC2 각각의 호스트 전체 기준이며 컨테이너·JVM·RDS 사용률이 아닙니다.
    data:
    - refId: A
      datasourceUid: prometheus
      relativeTimeRange:
        from: 300
        to: 0
      model:
        datasource:
          type: prometheus
          uid: prometheus
        editorMode: code
        expr: 100 * (1 - avg by (host_id) (irate(node_cpu_seconds_total{job="jarihana-host",mode="idle"}[2m])))
        refId: A
        instant: true
        range: false
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: "$A >= 80 && $A < 90"
        refId: B
        type: math
    isPaused: false
  - uid: jarihana-host-cpu-critical
    title: "[EC2] CPU 사용률 긴급"
    condition: B
    for: 0s
    noDataState: OK
    execErrState: Error
    labels:
      service_name: jarihana
      severity: critical
    annotations:
