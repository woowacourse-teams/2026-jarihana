<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410">
<defs>
  <style>
    @keyframes jarihana-flow { to { stroke-dashoffset: 0; } }
    .pool-connection { transform: translate(var(--pool-to-x, 0px), var(--pool-to-y, 0px)); }
    @media (prefers-reduced-motion: reduce) { .pool-connection, #cell-db-line path { animation: none !important; } }
    text { font-family: Inter, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
  </style>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#253146"/></pattern>
  <linearGradient id="server-fill" x2="1" y2="1"><stop stop-color="#1e3855"/><stop offset="1" stop-color="#121e31"/></linearGradient>
  <linearGradient id="db-fill" x2="1" y2="0"><stop stop-color="#211e3c"/><stop offset=".6" stop-color="#35315a"/><stop offset="1" stop-color="#211e3c"/></linearGradient>
</defs>
<rect width="1200" height="410" fill="#0c111b"/>
<rect width="1200" height="410" fill="url(#grid)" opacity=".5"/>
<g fill="#93a4bd" font-size="12">
<text x="32" y="30" letter-spacing="2">JARIHANA / SERVICE MAP</text>
<text x="1168" y="30" text-anchor="end">화면 5초 갱신 · 지표는 최근 2분 평균</text>
</g>
<g stroke="#233044" stroke-width="2" fill="none"><path d="M218 140 H511"/><path d="M511 190 H218"/></g>
<g id="cell-http-line"><path d="M218 140 H502" stroke="#4dd7ba" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 24" fill="none" style="animation: 2s linear 0s infinite normal none running jarihana-flow; stroke-dashoffset: 50;"/><path d="M511 140 l-8 -4 v8 Z" fill="#4dd7ba" stroke="#4dd7ba"/></g>
<g id="cell-response-line"><path d="M511 190 H227" stroke="#76b4ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 24" fill="none" style="animation: 2s linear 0s infinite normal none running jarihana-flow; stroke-dashoffset: 50;"/><path d="M218 190 l8 -4 v8 Z" fill="#76b4ff" stroke="#76b4ff"/></g>
<path d="M850 160 H1038" stroke="#233044" stroke-width="2" fill="none"/>
<g id="cell-db-line"><path d="M850 160 H1030" stroke="#4dd7ba" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 24" fill="none" style="animation: 2s linear 0s infinite normal none running jarihana-flow; stroke-dashoffset: 50;"/><path d="M1038 160 l-8 -4 v8 Z" fill="#4dd7ba" stroke="#4dd7ba"/></g>
<g fill="#93a4bd" font-size="13" text-anchor="middle"><text x="364" y="84">HTTP 요청</text></g>
<g id="cell-http-rps"><text x="364" y="115" text-anchor="middle" font-size="24" font-weight="600" fill="#e6edf7">—</text></g>
<text x="364" y="165" text-anchor="middle" font-size="11" fill="#93a4bd">Actuator 요청 제외</text>
<text x="364" y="221" text-anchor="middle" font-size="13" fill="#76b4ff">HTTP 응답 · 서버 처리시간</text>
<g font-size="11" fill="#b8c7dd"><circle cx="634" cy="87" r="3.5" fill="#4dd7ba"/><text x="644" y="91">사용</text><circle cx="686" cy="87" r="3.5" fill="#76b4ff"/><text x="696" y="91">유휴</text><circle cx="738" cy="87" r="3.5" fill="none" stroke="#536880" stroke-width="1.5"/><text x="748" y="91">미생성</text></g>
<g id="cell-pool-status"><text x="736" y="164" text-anchor="middle" font-size="11" fill="#93a4bd">수집 확인 불가</text></g>
<text x="736" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#e6edf7">HikariCP</text>
<text x="900" y="363" text-anchor="middle" font-size="11" fill="#93a4bd">노란 왕복 = 최근 사용 재생 · 개별 연결 추적 아님</text>
<g id="cell-browser" stroke="#91a7c5" stroke-width="3" fill="none"><rect x="110" y="111" width="100" height="76" rx="8" fill="#162235"/><path d="M110 133 H210 M137 207 H183 M150 187 V207 M170 187 V207"/><circle cx="122" cy="122" r="1.5"/><circle cx="132" cy="122" r="1.5"/><circle cx="142" cy="122" r="1.5"/><path d="m149 150 -8 9 8 9 m22 -18 8 9 -8 9 m-8 -23 -6 27"/></g>
<g id="cell-server" stroke="#76b4ff" stroke-width="3" fill="url(#server-fill)">
<rect x="529" y="101" width="102" height="34" rx="7"/><rect x="529" y="144" width="102" height="34" rx="7"/><rect x="529" y="187" width="102" height="34" rx="7"/>
<path d="M571 118 H616 M571 161 H616 M571 204 H616" stroke-width="2"/><circle cx="546" cy="118" r="3"/><circle cx="546" cy="161" r="3"/><circle cx="546" cy="204" r="3"/>
</g>
<g id="cell-database" transform="translate(100 0)" stroke="#b69cff" stroke-width="3" fill="url(#db-fill)">
<path d="M970 119 V200 C970 229 1070 229 1070 200 V119 Z"/><ellipse cx="1020" cy="119" rx="50" ry="18" fill="#363255"/><path d="M970 158 C970 183 1070 183 1070 158 M970 194 C970 219 1070 219 1070 194" fill="none"/>
</g>
<g id="cell-pool-node"><!-- pool-connection-nodes --></g>
<g font-size="22" font-weight="600" text-anchor="middle" fill="#e6edf7"><text x="160" y="259">사용자</text><text x="580" y="259">자리하나 API</text><text x="1120" y="259">PostgreSQL</text></g>
<g fill="#93a4bd" font-size="12" text-anchor="middle"><text x="306" y="251">p95</text><text x="422" y="251">p99</text></g>
<g id="cell-p95"><text x="306" y="278" text-anchor="middle" font-size="20" fill="#76b4ff">—</text></g>
<g id="cell-p99"><text x="422" y="278" text-anchor="middle" font-size="20" fill="#b69cff">—</text></g>
<g id="cell-http-errors"><text x="364" y="316" text-anchor="middle" font-size="13" fill="currentColor" style="color:#4dd7ba">5xx</text></g>
<g id="db-edge-metrics">
  <g fill="#93a4bd" font-size="12" text-anchor="middle"><text x="894" y="204">DB 호출</text><text x="994" y="204">DB p95</text></g>
  <g id="cell-db-rps"><text x="894" y="230" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf7">—</text></g>
  <g id="cell-db-p95"><text x="994" y="230" text-anchor="middle" font-size="19" font-weight="600" fill="#e6edf7">—</text></g>
</g>
<text x="944" y="258" text-anchor="middle" font-size="11" fill="#93a4bd">헬스체크·예약 작업 포함</text>
<g id="cell-pool-max"><text x="724" y="258" text-anchor="end" font-size="14" fill="#b8c7dd">최대</text></g>
<text x="736" y="258" text-anchor="middle" font-size="14" fill="#536880">·</text>
<g id="cell-pool-pending"><text x="748" y="258" font-size="14" fill="currentColor" style="color:#4dd7ba">대기</text></g>
<g fill="#93a4bd" font-size="11"><text x="32" y="391">HTTP·DB 공통선 속도 = 호출량 · 0건 또는 확인 불가 시 정지</text><text x="1168" y="391" text-anchor="end">풀 점·선에 마우스 → 상태 설명 · 클릭 / Enter → 풀 상세</text></g>
</svg>
