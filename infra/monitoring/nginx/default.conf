# grafana.jarihana.com의 80/443 server는 grafana.conf에 있다.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16m;

    # 수집 API는 인증 기능이 없으므로 사설망에서만 접근한다.
    # EC2 보안 그룹에서도 8080의 출발지를 앱 EC2 보안 그룹으로 제한한다.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /prometheus/api/v1/write {
        limit_except POST { deny all; }
        proxy_pass http://prometheus:9090/api/v1/write;
    }

    # Deployment coordinator private IP, verified during instance setup.
    # Keep this exact allowlist in sync if that coordinator is replaced.
    location = /prometheus/api/v1/query {
        allow 10.0.3.66;
        deny all;
        limit_except GET { deny all; }
        proxy_read_timeout 3s;
        proxy_pass http://prometheus:9090/api/v1/query;
    }

    location = /loki/api/v1/push {
        limit_except POST { deny all; }
        proxy_pass http://loki:3100;
    }

    # Tempo is intentionally disabled in the default monitoring stack.
    # Re-enable the tracing profile and restore this proxy_pass before sending OTLP traces.
    location = /tempo/v1/traces {
        return 404;
    }

    location / {
        return 404;
    }
}
