map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    return 404;
}

server {
    listen 80;
    server_name grafana.jarihana.com;
    server_tokens off;

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16m;

    # 수집 API는 인증 기능이 없으므로 사설망에서만 접근한다.
    # EC2 보안 그룹에서도 8080의 출발지를 앱 EC2 보안 그룹으로 제한한다.
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;

    location = /prometheus/api/v1/write {
        limit_except POST { deny all; }
        proxy_pass http://prometheus:9090/api/v1/write;
    }

    location = /loki/api/v1/push {
        limit_except POST { deny all; }
        proxy_pass http://loki:3100;
    }

    location = /tempo/v1/traces {
        limit_except POST { deny all; }
        proxy_pass http://tempo:4318/v1/traces;
    }

    location / {
        return 404;
    }
}
