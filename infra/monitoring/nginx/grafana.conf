# grafana.jarihana.com 공개 주소. HTTPS 인증서는 nginx ACME 모듈이 Let's Encrypt에서 받고 만료 전에 갱신한다.
# ACME 지시어는 nginx.conf의 load_module이 있어야 읽히므로 수집 API(default.conf)와 파일을 나눴다.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ACME 서버 주소 조회용 Docker 내장 DNS
resolver 127.0.0.11 ipv6=off;

acme_issuer letsencrypt {
    uri https://acme-v02.api.letsencrypt.org/directory;
    # 계정 키와 인증서를 볼륨에 보관해 컨테이너를 재생성해도 다시 발급하지 않는다.
    state_path /var/cache/nginx/acme-letsencrypt;
    accept_terms_of_service;
}

# 다른 이름이나 IP로 들어온 TLS 연결은 인증서를 보여 주지 않고 끊는다.
server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    # ACME 모듈이 이 80 listener에서 HTTP-01 확인 요청에 먼저 응답한다.
    listen 80;
    server_name grafana.jarihana.com;
    server_tokens off;

    # 배포 workflow와 컨테이너 healthcheck는 사설 주소의 HTTP로 확인한다.
    location = /api/health {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grafana.jarihana.com;
    server_tokens off;

    acme_certificate letsencrypt;
    ssl_certificate $acme_certificate;
    ssl_certificate_key $acme_certificate_key;
    ssl_certificate_cache max=2;

    location / {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
