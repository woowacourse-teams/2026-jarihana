stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

metrics_generator:
  registry:
    collection_interval: 5s
    external_labels:
      source: tempo
  processor:
    span_metrics:
      dimensions: [deployment.environment.name]
    service_graphs:
      dimensions: [deployment.environment.name]
      histogram_buckets: [.001, .002, .005, .01, .025, .05, .1, .25, .5, 1, 2.5, 5, 10]
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        queue_config:
          batch_send_deadline: 1s

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

usage_report:
  reporting_enabled: false
